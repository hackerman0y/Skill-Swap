<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SkillSwap - Notifications</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .notif-page-wrapper {
            max-width: 680px;
            margin: 0 auto;
            padding: 20px 16px;
        }

        .notif-page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .notif-page-header h3 { color: var(--primary); }

        .mark-all-btn {
            background: transparent;
            border: 1.5px solid var(--primary);
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .notif-list { display: flex; flex-direction: column; gap: 10px; }

        .notif-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 18px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            cursor: pointer;
            transition: background 0.15s;
            position: relative;
        }
        .notif-card:hover { background: var(--bg); }
        .notif-card.unread { border-left: 3px solid var(--primary); }

        .notif-icon {
            font-size: 1.4rem;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .notif-body { flex: 1; }

        .notif-title {
            font-weight: 600;
            font-size: 0.88rem;
            margin-bottom: 4px;
            color: var(--text);
        }

        .notif-text {
            font-size: 0.8rem;
            color: var(--text-light);
            line-height: 1.4;
        }

        .notif-time {
            font-size: 0.72rem;
            color: var(--text-light);
            margin-top: 6px;
        }

        .unread-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
            flex-shrink: 0;
            margin-top: 6px;
        }

        .empty-notif {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }
        .empty-notif span { font-size: 2.5rem; display: block; margin-bottom: 10px; }

        .notif-loading {
            text-align: center;
            padding: 40px;
            color: var(--text-light);
        }

        /* ── Minimal navbar for this page ── */
        .notif-navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            height: 62px;
            border-bottom: 1px solid var(--border);
            background: var(--card);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .notif-navbar-logo {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text);
            cursor: pointer;
            letter-spacing: -0.4px;
        }
        .notif-navbar-logo span { color: var(--primary); }

        .notif-navbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Bell icon button — same style as index.html */
        .nav-icon-btn {
            position: relative;
            width: 36px; height: 36px;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: var(--text-light);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            overflow: visible;
        }
        .nav-icon-btn svg { width: 18px; height: 18px; }
        .nav-icon-btn:hover { background: rgba(108,99,255,0.08); color: var(--primary); }

        /* External badge — sits OUTSIDE the icon */
        .nav-badge {
            position: absolute;
            top: -5px; right: -5px;
            min-width: 16px; height: 16px;
            background: #ef4444;
            color: white;
            border-radius: 20px;
            font-size: 0.6rem;
            font-weight: 700;
            line-height: 1;
            display: none;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--bg, #fff);
            padding: 0 3px;
            pointer-events: none;
            z-index: 10;
        }
        .nav-badge.visible { display: flex; }

        .mode-toggle {
            width: 36px; height: 36px;
            border-radius: 10px;
            border: 1.5px solid var(--border);
            background: transparent;
            color: var(--text-light);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            transition: all 0.15s;
        }
        .mode-toggle:hover { border-color: var(--primary); color: var(--primary); }

        .btn-back {
            padding: 6px 14px;
            border-radius: 20px;
            border: 1.5px solid var(--border);
            background: transparent;
            color: var(--text-light);
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.15s;
        }
        .btn-back:hover { border-color: var(--primary); color: var(--primary); }
    </style>
</head>
<body>

<!-- ── Navbar: just logo + bell (external badge) + mode + back ── -->
<div class="notif-navbar">
    <div class="notif-navbar-logo" onclick="navigate('index.html')">
        Skill<span>Swap</span>
    </div>
    <div class="notif-navbar-right">
        <!-- NO bell button here at all -->
        <button class="mode-toggle" id="modeBtn" onclick="toggleMode()">🌙</button>
        <button class="btn-back" onclick="navigate('index.html')">← Back</button>
    </div>
</div>

<!-- Full notifications page -->
<div class="notif-page-wrapper">
    <div class="notif-page-header">
        <h3>🔔 Notifications</h3>
        <button class="mark-all-btn" onclick="markAllRead()">Mark all as read</button>
    </div>
    <div id="notifPageList">
        <div class="notif-loading">Loading notifications...</div>
    </div>
</div>

<script>
    const API   = "http://localhost:8080";
    const token = localStorage.getItem("token");
    const currentUserId = localStorage.getItem("userId");

    if (!token) { location.href = "login.html"; }

    function navigate(url) {
        sessionStorage.setItem('navigating', 'true');
        location.href = url;
    }

    const modeBtn = document.getElementById("modeBtn");
    if (localStorage.getItem("mode") === "dark") {
        document.body.classList.add("dark");
        modeBtn.innerText = "☀️";
    }
    function toggleMode() {
        document.body.classList.toggle("dark");
        const dark = document.body.classList.contains("dark");
        localStorage.setItem("mode", dark ? "dark" : "light");
        modeBtn.innerText = dark ? "☀️" : "🌙";
    }

    function authHeaders() {
        return { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" };
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
    }

    function timeAgo(isoString) {
        if (!isoString) return '';
        const d = new Date(isoString);
        const diff = Math.floor((Date.now() - d) / 1000);
        if (diff < 60) return 'just now';
        if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
        if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
        return Math.floor(diff / 86400) + 'd ago';
    }

    function notifIcon(type) {
        const icons = {
            'message':       '💬',
            'swap_request':  '🔄',
            'swap_accepted': '✅',
            'swap_rejected': '❌',
            'session':       '📅',
            'like':          '❤️',
            'system':        '📢',
        };
        return icons[type] || '🔔';
    }

    function notifTitle(type) {
        const titles = {
            'message':       'New Message',
            'swap_request':  'New Swap Request',
            'swap_accepted': 'Swap Accepted',
            'swap_rejected': 'Swap Rejected',
            'session':       'Session Update',
            'like':          'Someone liked your skill',
        };
        return titles[type] || 'Notification';
    }


    // ── Load full notifications list ──
    async function loadNotifications() {
        const list = document.getElementById("notifPageList");
        try {
            const res = await fetch(`${API}/api/notifications`, { headers: authHeaders() });

            if (res.status === 401 || res.status === 403) { navigate('login.html'); return; }

            if (!res.ok) {
                list.innerHTML = renderPlaceholders();
                return;
            }

            const notifications = await res.json();




            if (!notifications.length) {
                list.innerHTML = `
                    <div class="empty-notif">
                        <span>🔔</span>
                        <p>No notifications yet</p>
                    </div>`;
                return;
            }

            list.innerHTML = `<div class="notif-list">${
                notifications.map(n => `
                    <div class="notif-card ${n.read ? '' : 'unread'}"
                         onclick="handleNotifClick('${n.id}', '${n.type}', '${n.relatedId || ''}')">
                        <div class="notif-icon">${notifIcon(n.type)}</div>
                        <div class="notif-body">
                            <div class="notif-title">${escapeHtml(n.title || notifTitle(n.type))}</div>
                            <div class="notif-text">${escapeHtml(n.message || '')}</div>
                            <div class="notif-time">${timeAgo(n.createdAt)}</div>
                        </div>
                        ${!n.read ? '<div class="unread-dot"></div>' : ''}
                    </div>
                `).join('')
            }</div>`;

        } catch(e) {
            list.innerHTML = renderPlaceholders();
        }
    }

    // ── Placeholder cards if API not ready ──
    function renderPlaceholders() {
        const samples = [
            { icon: '💬', title: 'New Message',   text: 'WebSocket messages will appear here',              unread: true  },
            { icon: '🔄', title: 'Swap Request',  text: "Swap request notifications from Yousef's module", unread: true  },
            { icon: '✅', title: 'Swap Accepted', text: 'Your swap request was accepted',                   unread: false },
        ];
        return `
            <div style="background:rgba(108,99,255,0.07);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:0.8rem;color:var(--text-light);">
                ℹ️ Showing placeholder data — connect <code>/api/notifications</code> to see real notifications.
            </div>
            <div class="notif-list">
                ${samples.map(s => `
                    <div class="notif-card ${s.unread ? 'unread' : ''}">
                        <div class="notif-icon">${s.icon}</div>
                        <div class="notif-body">
                            <div class="notif-title">${s.title}</div>
                            <div class="notif-text">${s.text}</div>
                            <div class="notif-time">just now</div>
                        </div>
                        ${s.unread ? '<div class="unread-dot"></div>' : ''}
                    </div>
                `).join('')}
            </div>`;
    }

    // ── Handle click on a notification card ──
    async function handleNotifClick(notifId, type, relatedId) {
        try {
            await fetch(`${API}/api/notifications/${notifId}/read`, {
                method: 'PUT',
                headers: authHeaders()
            });
        } catch(e) {}

        if (type === 'message' && relatedId) {
            navigate(`chat.html?userId=${relatedId}`);
        } else if ((type === 'swap_request' || type === 'swap_accepted') && relatedId) {
            navigate(`index.html`);
        }

        // Refresh list + badge after marking read
        loadNotifications();
    }

    async function markAllRead() {
        try {
            await fetch(`${API}/api/notifications/read-all`, {
                method: 'PUT',
                headers: authHeaders()
            });
        } catch(e) {}
        loadNotifications();
    }

    window.addEventListener('beforeunload', () => {
        const navigating = sessionStorage.getItem('navigating');
        if (currentUserId && !navigating) {
            navigator.sendBeacon(`${API}/presence/offline/${currentUserId}`);
        }
        sessionStorage.removeItem('navigating');
    });

    loadNotifications();
</script>
</body>
</html>
