<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SkillSwap - Messages</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .chat-list-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .chat-list-header h3 { color: var(--primary); margin: 0; }

        .chat-list-wrapper {
            max-width: 680px;
            margin: 0 auto;
        }

        .chat-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            background: var(--card);
            transition: background 0.15s;
        }
        .chat-item:hover { background: var(--bg); }

        .chat-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
            flex-shrink: 0;
            position: relative;
        }

        .online-ring {
            position: absolute;
            bottom: 1px;
            right: 1px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 2px solid var(--card);
            background: #64748b;
        }
        .online-ring.is-online { background: #10b981; }

        .chat-meta { flex: 1; min-width: 0; }

        .chat-meta-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3px;
        }

        .chat-username {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text);
        }

        .chat-time {
            font-size: 0.72rem;
            color: var(--text-light);
        }

        .chat-preview {
            font-size: 0.82rem;
            color: var(--text-light);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .unread-badge {
            background: var(--primary);
            color: white;
            border-radius: 50%;
            font-size: 0.65rem;
            font-weight: bold;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .empty-chat {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }
        .empty-chat p { margin-top: 10px; font-size: 0.9rem; }

        .chat-list-loading {
            text-align: center;
            padding: 40px;
            color: var(--text-light);
        }
    </style>
</head>
<body>

<div class="navbar">
    <h2 onclick="navigate('index.html')">SkillSwap</h2>
    <div class="nav-right">
        <button class="mode-btn" id="modeBtn" onclick="toggleMode()">🌙</button>
    </div>
</div>

<div class="chat-list-wrapper">
    <div class="chat-list-header">
        <h3>💬 Messages</h3>
    </div>
    <div id="chatListContainer">
        <div class="chat-list-loading">Loading conversations...</div>
    </div>
</div>

<script>
    const API = "http://localhost:8080";
    const token = localStorage.getItem("token");
    const currentUserId = localStorage.getItem("userId");
    const currentUsername = localStorage.getItem("username");

    if (!token) { location.href = "login.html"; }

    function navigate(url) {
        sessionStorage.setItem('navigating', 'true');
        location.href = url;
    }

    const modeBtn = document.getElementById("modeBtn");
    if (localStorage.getItem("mode") === "dark") {
        document.body.classList.add("dark");
        modeBtn.innerText = "☀️";
    }
    function toggleMode() {
        document.body.classList.toggle("dark");
        const dark = document.body.classList.contains("dark");
        localStorage.setItem("mode", dark ? "dark" : "light");
        modeBtn.innerText = dark ? "☀️" : "🌙";
    }

    function authHeaders() {
        return { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" };
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
    }

    function timeAgo(isoString) {
        if (!isoString) return '';
        const d = new Date(isoString);
        const now = new Date();
        const diff = Math.floor((now - d) / 1000);
        if (diff < 60) return 'now';
        if (diff < 3600) return Math.floor(diff / 60) + 'm';
        if (diff < 86400) return Math.floor(diff / 3600) + 'h';
        return d.toLocaleDateString();
    }

    async function loadChatList() {
        const container = document.getElementById("chatListContainer");
        try {
            // Load all users so Moataz can start a chat with anyone
            const res = await fetch(`${API}/api/users`, { headers: authHeaders() });

            if (res.status === 401 || res.status === 403) {
                navigate('login.html'); return;
            }

            if (!res.ok) throw new Error();

            const users = await res.json();
            // Filter out current user
            const others = users.filter(u => String(u.id) !== String(currentUserId));

            if (!others.length) {
                container.innerHTML = `
                    <div class="empty-chat">
                        <div style="font-size:2.5rem;">💬</div>
                        <p>No other users yet. Invite a friend!</p>
                    </div>`;
                return;
            }

            container.innerHTML = others.map(user => {
                const initial = (user.username?.charAt(0) || "U").toUpperCase();
                return `
                <div class="chat-item" onclick="navigate('chat.html?userId=${user.id}&username=${encodeURIComponent(user.username)}')">
                    <div class="chat-avatar">
                        ${escapeHtml(initial)}
                        <div class="online-ring ${user.online ? 'is-online' : ''}"></div>
                    </div>
                    <div class="chat-meta">
                        <div class="chat-meta-top">
                            <span class="chat-username">${escapeHtml(user.username)}</span>
                            <span class="chat-time">${user.online ? '🟢' : ''}</span>
                        </div>
                        <div class="chat-preview">
                            ${user.online ? 'Online now' : 'Tap to start chatting'}
                        </div>
                    </div>
                </div>`;
            }).join('');

        } catch (e) {
            container.innerHTML = `
                <div class="empty-chat">
                    <div style="font-size:2rem;">⚠️</div>
                    <p>Could not load users. Is the server running?</p>
                </div>`;
        }
    }

    window.addEventListener('beforeunload', () => {
        const navigating = sessionStorage.getItem('navigating');
        if (currentUserId && !navigating) {
            navigator.sendBeacon(`${API}/presence/offline/${currentUserId}`);
        }
        sessionStorage.removeItem('navigating');
    });

    loadChatList();
</script>
</body>
</html>
