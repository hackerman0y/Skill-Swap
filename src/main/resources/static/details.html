<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Skill Details</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .details-container { max-width: 750px; margin: 40px auto; padding: 20px; }

        .details-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 32px;
            box-shadow: var(--shadow-md); text-align: center; position: relative;
        }
        .details-card h2 { margin-bottom: 12px; font-size: 1.6rem; color: var(--text); }

        .meta { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; justify-content: center; }
        .category { background: var(--bg); border: 1px solid var(--border); padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; color: var(--text); }
        .description { margin: 14px 0; color: var(--text-light); line-height: 1.7; }

        .swap-info { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 14px 0; }
        .swap-pill { display: flex; align-items: center; gap: 6px; background: var(--bg); border: 1px solid var(--border); padding: 7px 16px; border-radius: 20px; font-size: 0.82rem; color: var(--text); }
        .swap-pill span { color: var(--text-light); }

        .popularity { margin-top: 10px; font-size: 0.9rem; color: var(--text); }

        .actions { margin-top: 22px; display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }

        .like-btn {
            padding: 10px 28px; border-radius: 30px; border: none;
            cursor: pointer; font-weight: 600; color: white;
            background: linear-gradient(135deg, #ff4d6d, #ff758f);
            transition: 0.2s; font-size: 0.9rem;
        }
        .like-btn:hover:not(:disabled) { transform: scale(0.97); opacity: 0.9; }
        .like-btn:disabled { background: var(--border); color: var(--text-light); cursor: not-allowed; }

        .chat-btn {
            padding: 10px 28px; border-radius: 30px; border: none;
            cursor: pointer; font-weight: 600; color: white;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            transition: 0.2s; font-size: 0.9rem;
            box-shadow: 0 4px 14px rgba(108,99,255,0.3);
        }
        .chat-btn:hover { transform: scale(0.97); opacity: 0.9; }

        .swap-btn {
            padding: 10px 28px; border-radius: 30px; border: none;
            cursor: pointer; font-weight: 600; color: white;
            background: linear-gradient(135deg, #10b981, #059669);
            transition: 0.2s; font-size: 0.9rem;
            box-shadow: 0 4px 14px rgba(16,185,129,0.3);
        }
        .swap-btn:hover { transform: scale(0.97); opacity: 0.9; }

        .user-info-detail { display: flex; align-items: center; gap: 14px; margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--border); text-align: left; }
        .detail-avatar { width: 52px; height: 52px; border-radius: 16px; background: linear-gradient(135deg, var(--primary), var(--primary-light)); display: flex; align-items: center; justify-content: center; font-weight: 700; color: white; font-size: 1.2rem; flex-shrink: 0; }
        .online-status { font-size: 0.8rem; color: var(--text-light); margin-top: 2px; }
        .user-name-detail { font-weight: 700; font-size: 1rem; color: var(--text); }

        /* ── SWAP MODAL ── */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.55);
            backdrop-filter: blur(4px);
            display: none; align-items: center; justify-content: center;
            z-index: 1000; padding: 20px;
        }
        .modal-overlay.open { display: flex; }
        .modal-box {
            background: var(--card); border-radius: 24px; padding: 28px 24px;
            max-width: 420px; width: 100%;
            animation: popIn 0.25s cubic-bezier(0.34,1.56,0.64,1);
        }
        @keyframes popIn { from{transform:scale(0.85);opacity:0} to{transform:scale(1);opacity:1} }

        .modal-title { font-size: 1.15rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
        .modal-sub   { font-size: 0.82rem; color: var(--text-light); margin-bottom: 20px; }
        .modal-label { font-size: 0.82rem; font-weight: 600; color: var(--text); margin-bottom: 6px; display: block; }

        .target-skill-display {
            background: rgba(108,99,255,0.06); border: 1px solid rgba(108,99,255,0.2);
            border-radius: 12px; padding: 12px 16px; margin-bottom: 16px;
            font-size: 0.85rem; color: var(--text);
        }
        .target-skill-display strong { color: var(--primary); }

        .modal-select {
            width: 100%; padding: 11px 14px;
            border: 1.5px solid var(--border); border-radius: 12px;
            background: var(--bg); color: var(--text);
            font-size: 0.88rem; outline: none; font-family: inherit;
            transition: border-color 0.2s; margin-bottom: 20px; cursor: pointer;
        }
        .modal-select:focus { border-color: var(--primary); }

        .modal-btns { display: flex; gap: 10px; }
        .modal-cancel-btn {
            flex: 1; padding: 11px; border-radius: 14px;
            border: 1.5px solid var(--border); background: transparent;
            color: var(--text-light); font-size: 0.88rem; font-weight: 600;
            cursor: pointer; font-family: inherit; transition: all 0.15s;
        }
        .modal-cancel-btn:hover { border-color: var(--primary); color: var(--primary); }
        .modal-confirm-btn {
            flex: 1; padding: 11px; border-radius: 14px; border: none;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white; font-size: 0.88rem; font-weight: 700;
            cursor: pointer; font-family: inherit;
            box-shadow: 0 4px 14px rgba(16,185,129,0.3); transition: all 0.15s;
        }
        .modal-confirm-btn:hover { opacity: 0.92; }
        .modal-confirm-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        /* ── TOAST ── */
        .toast {
            position: fixed; bottom: 28px; left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #10b981; color: white;
            padding: 12px 24px; border-radius: 20px;
            font-size: 0.88rem; font-weight: 600;
            box-shadow: 0 8px 24px rgba(16,185,129,0.35);
            z-index: 2000; transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
            white-space: nowrap; pointer-events: none;
        }
        .toast.show  { transform: translateX(-50%) translateY(0); }
        .toast.error { background: var(--danger); }
    </style>
</head>
<body>

<nav class="navbar">
    <h2 onclick="navigate('index.html')">🔄 SkillSwap</h2>
    <div class="nav-right">
        <button onclick="navigate('index.html')">🏠</button>
        <button onclick="navigate('swaps.html')">🔄 Swaps</button>
        <button onclick="navigate('profile.html')">👤 Profile</button>
        <button class="mode-btn" id="modeBtn" onclick="toggleMode()">🌙</button>
    </div>
</nav>

<div class="details-container">
    <div class="details-card" id="details">
        <p style="color:var(--text-light);">Loading...</p>
    </div>
</div>

<!-- ── SWAP REQUEST MODAL ── -->
<div class="modal-overlay" id="swapModal">
    <div class="modal-box">
        <div class="modal-title">🔄 Send Swap Request</div>
        <div class="modal-sub">Choose one of your skills to offer in exchange</div>

        <div class="target-skill-display">
            You want: <strong id="modalTargetSkill">—</strong>
        </div>

        <label class="modal-label" for="mySkillSelect">📖 Your skill to offer:</label>
        <select class="modal-select" id="mySkillSelect">
            <option value="">Loading your skills...</option>
        </select>

        <div class="modal-btns">
            <button class="modal-cancel-btn" onclick="closeSwapModal()">Cancel</button>
            <button class="modal-confirm-btn" id="swapConfirmBtn" onclick="confirmSwap()">Send Request ✓</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<footer>
    <p>© 2026 SkillSwap — Learn & Teach Skills Easily 🚀</p>
</footer>

<script>
    const API         = "http://localhost:8080";
    const currentUserId = localStorage.getItem("userId");

    function navigate(url) { sessionStorage.setItem('navigating','true'); location.href = url; }

    const modeBtn = document.getElementById("modeBtn");
    if (localStorage.getItem("mode") === "dark") { document.body.classList.add("dark"); modeBtn.innerText = "☀️"; }
    function toggleMode() {
        document.body.classList.toggle("dark");
        const dark = document.body.classList.contains("dark");
        localStorage.setItem("mode", dark ? "dark" : "light");
        modeBtn.innerText = dark ? "☀️" : "🌙";
    }

    function showToast(msg, isError = false) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.className   = `toast${isError ? ' error' : ''}`;
        setTimeout(() => t.classList.add("show"), 10);
        setTimeout(() => t.classList.remove("show"), 3500);
    }

    const params = new URLSearchParams(window.location.search);
    const id     = params.get("id");

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m==='&'?'&amp;':m==='<'?'&lt;':'&gt;');
    }

    function authHeaders() {
        const token = localStorage.getItem("token");
        return { "Content-Type": "application/json", "Authorization": `Bearer ${token}` };
    }

    function isAlreadyLiked(skillId) {
        const liked = JSON.parse(localStorage.getItem(`likedSkills_${currentUserId}`) || "[]");
        return liked.includes(skillId);
    }
    function markAsLiked(skillId) {
        const liked = JSON.parse(localStorage.getItem(`likedSkills_${currentUserId}`) || "[]");
        if (!liked.includes(skillId)) {
            liked.push(skillId);
            localStorage.setItem(`likedSkills_${currentUserId}`, JSON.stringify(liked));
        }
    }

    // ── Swap state ──
    let targetSkillId = null;
    let targetOwnerId = null;

    const container = document.getElementById("details");

    if (!id) {
        container.innerHTML = "<h3>Invalid skill</h3>";
    } else {
        fetch(`${API}/api/skills/${id}`)
            .then(res => { if (!res.ok) throw new Error(); return res.json(); })
            .then(skill => {
                const user         = skill.user || {};
                const isOwn        = String(user.id) === String(currentUserId);
                const alreadyLiked = isAlreadyLiked(skill.id);

                targetSkillId = skill.id;
                targetOwnerId = user.id;

                container.innerHTML = `
                    <h2>${escapeHtml(skill.name)}</h2>
                    <div class="meta">
                        <span class="category">#${escapeHtml(skill.category || 'General')}</span>
                        <span class="type-badge ${skill.type==='teach'?'type-teach':'type-learn'}">
                            ${skill.type==='teach' ? '📖 TEACH' : '📚 LEARN'}
                        </span>
                    </div>
                    ${skill.description ? `<p class="description">${escapeHtml(skill.description)}</p>` : ''}
                    ${(skill.skillToTeach || skill.skillToLearn) ? `
                    <div class="swap-info">
                        ${skill.skillToTeach ? `<div class="swap-pill">📖 <span>Teaches:</span> <strong>${escapeHtml(skill.skillToTeach)}</strong></div>` : ''}
                        ${skill.skillToLearn ? `<div class="swap-pill">📚 <span>Wants to learn:</span> <strong>${escapeHtml(skill.skillToLearn)}</strong></div>` : ''}
                    </div>` : ''}
                    <div class="popularity">🔥 Popularity: <span id="popCount">${skill.popularity || 0}</span></div>
                    <div class="actions">
                        <button class="like-btn" id="likeBtn"
                            onclick="likeSkill(${skill.id})"
                            ${alreadyLiked || isOwn ? 'disabled' : ''}>
                            ${alreadyLiked ? '❤️ Liked' : isOwn ? '❤️ Your skill' : '🤍 Like'}
                        </button>
                        ${!isOwn && user.id ? `
                        <button class="chat-btn"
                            onclick="navigate('chat.html?userId=${user.id}&username=${encodeURIComponent(user.username||'User')}')">
                            💬 Chat with ${escapeHtml(user.username || 'User')}
                        </button>
                        <button class="swap-btn" onclick="openSwapModal('${escapeHtml(skill.name).replace(/'/g,"\\'")}')">
                            🔄 Send Swap Request
                        </button>` : ''}
                    </div>
                    <div class="user-info-detail">
                        <div class="detail-avatar">${(user.username?.charAt(0)||'U').toUpperCase()}</div>
                        <div>
                            <div class="user-name-detail">${escapeHtml(user.username||'Unknown')}</div>
                            <div class="online-status">${user.online ? '🟢 Online' : '⚫ Offline'}</div>
                        </div>
                    </div>
                `;
            })
            .catch(() => { container.innerHTML = "<h3>Skill not found</h3>"; });
    }

    // ── Open swap modal ──
    async function openSwapModal(targetSkillName) {
        if (!localStorage.getItem("token")) { alert("Please login first!"); navigate('login.html'); return; }

        document.getElementById("modalTargetSkill").textContent = targetSkillName;
        document.getElementById("swapModal").classList.add("open");

        const select = document.getElementById("mySkillSelect");
        select.innerHTML = '<option value="">Loading your skills...</option>';

        try {
            const res = await fetch(`${API}/api/skills/user/${currentUserId}`, { headers: authHeaders() });
            if (!res.ok) throw new Error();
            const mySkills = await res.json();

            if (!mySkills.length) {
                select.innerHTML = '<option value="">You have no skills — add one first!</option>';
                return;
            }
            select.innerHTML = '<option value="">-- Select your skill to offer --</option>' +
                mySkills.map(s => `<option value="${s.id}">${escapeHtml(s.name)} (${s.type})</option>`).join('');
        } catch(e) {
            select.innerHTML = '<option value="">Could not load your skills</option>';
        }
    }

    function closeSwapModal() {
        document.getElementById("swapModal").classList.remove("open");
    }

    // ── Send swap request → POST /api/swaps ──
    async function confirmSwap() {
        const offeredSkillId = document.getElementById("mySkillSelect").value;
        if (!offeredSkillId) { showToast("❌ Please select a skill to offer", true); return; }
        if (!targetSkillId || !targetOwnerId) { showToast("❌ Invalid target", true); return; }

        const btn = document.getElementById("swapConfirmBtn");
        btn.disabled = true; btn.textContent = "Sending...";

        try {
            const res = await fetch(`${API}/api/swaps`, {
                method:  "POST",
                headers: authHeaders(),
                body: JSON.stringify({
                    receiverId:     targetOwnerId,
                    offeredSkillId: parseInt(offeredSkillId),
                    wantedSkillId:  targetSkillId
                })
            });

            if (res.ok) {
                closeSwapModal();
                showToast("🎉 Swap request sent successfully!");
                setTimeout(() => navigate('swaps.html'), 2000);
            } else {
                const err = await res.text();
                showToast("❌ " + (err || "Could not send request"), true);
            }
        } catch(e) {
            showToast("❌ Could not connect to server", true);
        }

        btn.disabled = false; btn.textContent = "Send Request ✓";
    }

    document.getElementById("swapModal").addEventListener("click", function(e) {
        if (e.target === this) closeSwapModal();
    });

    async function likeSkill(skillId) {
        const token = localStorage.getItem("token");
        if (!token) { alert("Please login to like!"); navigate('login.html'); return; }
        if (isAlreadyLiked(skillId)) { alert("You already liked this! ❤️"); return; }
        try {
            const res = await fetch(`${API}/api/skills/${skillId}/increase`, { method:"PUT", headers: authHeaders() });
            if (res.ok) {
                const updated = await res.json();
                document.getElementById("popCount").textContent = updated.popularity || 0;
                markAsLiked(skillId);
                const btn = document.getElementById("likeBtn");
                btn.textContent = "❤️ Liked"; btn.disabled = true;
            }
        } catch(e) { console.error("Like failed", e); }
    }

    window.addEventListener('beforeunload', () => {
        const userId     = localStorage.getItem('userId');
        const navigating = sessionStorage.getItem('navigating');
        if (userId && !navigating) navigator.sendBeacon(`${API}/presence/offline/${userId}`);
        sessionStorage.removeItem('navigating');
    });
</script>
</body>
</html>
