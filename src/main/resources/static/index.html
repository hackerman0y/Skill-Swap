<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SkillSwap</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="navbar">
    <h2 onclick="navigate('index.html')" style="display:flex;align-items:center;gap:8px;">
        🔄 SkillSwap
    </h2>

    <!-- Hamburger for mobile -->
    <button class="hamburger" onclick="toggleMobileNav()" aria-label="Menu">
        <span></span><span></span><span></span>
    </button>

    <div class="nav-right" id="navRight">
        <!-- 🪙 LIVE COIN COUNTER -->
        <div onclick="navigate('store.html')" title="Go to Store" style="
            display:flex; align-items:center; gap:6px;
            background:linear-gradient(135deg,#f59e0b,#d97706);
            color:white; padding:6px 14px; border-radius:20px;
            font-size:0.82rem; font-weight:700;
            box-shadow:0 2px 8px rgba(245,158,11,0.35);
            cursor:pointer; transition:opacity 0.2s; flex-shrink:0;">
            🪙 <span id="navCoinCount">—</span>
        </div>
        <!-- 🛍️ STORE -->
        <span onclick="navigate('store.html')" style="cursor:pointer;" title="Store">🛍️</span>
        <!-- 💬 CHAT WITH UNREAD BADGE -->
        <div style="position:relative; display:inline-block; cursor:pointer;"
             onclick="navigate('chat-list.html')" title="Messages">
            💬
            <span id="chatBadge" style="
                display:none;
                position:absolute; top:-6px; right:-8px;
                background:#ef4444; color:white;
                border-radius:50%; width:18px; height:18px;
                font-size:0.62rem; font-weight:700;
                align-items:center; justify-content:center;
                border:2px solid var(--card);">
            </span>
        </div>
        <span onclick="navigate('notifications.html')" style="cursor:pointer;" title="Notifications">🔔</span>
        <span onclick="toggleFilters()" style="cursor:pointer;" title="Filters">⚙️</span>
        <div id="filtersBox" class="filters-box">
            <select id="catFilter">
                <option value="">All</option>
                <option>Programming</option>
                <option>Design</option>
                <option>Business</option>
                <option>Language</option>
                <option>Fitness</option>
            </select>
            <select id="sortFilter">
                <option value="">Sort</option>
                <option value="az">A-Z</option>
                <option value="za">Z-A</option>
                <option value="pop">🔥 Popular</option>
            </select>
        </div>
        <span id="navUser"></span>
        <span onclick="navigate('profile.html')" style="cursor:pointer;" title="Profile">👤</span>
        <span onclick="navigate('about.html')" style="cursor:pointer; font-size:0.82rem; font-weight:600; color:var(--text-light);" title="About">About</span>
        <span onclick="navigate('contact.html')" style="cursor:pointer; font-size:0.82rem; font-weight:600; color:var(--text-light);" title="Contact">Contact</span>
        <button class="mode-btn" id="modeBtn" onclick="toggleMode()">🌙</button>
    </div>
</div>

<!-- Mobile nav drawer -->
<div class="mobile-nav" id="mobileNav">
    <span onclick="navigate('index.html'); closeMobileNav()">🏠 Home</span>
    <span onclick="navigate('store.html'); closeMobileNav()">🛍️ Store &nbsp;<span id="mobileCoins" style="background:linear-gradient(135deg,#f59e0b,#d97706);color:white;padding:2px 8px;border-radius:20px;font-size:0.75rem;font-weight:700;">—</span></span>
    <span onclick="navigate('chat-list.html'); closeMobileNav()">💬 Messages</span>
    <span onclick="navigate('notifications.html'); closeMobileNav()">🔔 Notifications</span>
    <span onclick="navigate('profile.html'); closeMobileNav()">👤 Profile</span>
    <span onclick="navigate('about.html'); closeMobileNav()">ℹ️ About</span>
    <span onclick="navigate('contact.html'); closeMobileNav()">✉️ Contact</span>
    <span onclick="closeMobileNav(); logout()" style="color:var(--danger);">🚪 Logout</span>
</div>

<!-- Bottom navigation (mobile only) -->
<nav class="bottom-nav">
    <div class="bottom-nav-inner">
        <div class="bottom-nav-item active" onclick="navigate('index.html')">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">Home</span>
        </div>
        <div class="bottom-nav-item" onclick="navigate('chat-list.html')">
            <span class="nav-icon">💬</span>
            <span class="nav-label">Chat</span>
            <span class="bottom-nav-badge" id="bottomChatBadge" style="display:none;"></span>
        </div>
        <div class="bottom-nav-item" onclick="openModal()">
            <span class="nav-icon" style="font-size:1.6rem; color:var(--primary);">＋</span>
            <span class="nav-label">Add</span>
        </div>
        <div class="bottom-nav-item" onclick="navigate('store.html')">
            <span class="nav-icon">🛍️</span>
            <span class="nav-label">Store</span>
        </div>
        <div class="bottom-nav-item" onclick="navigate('profile.html')">
            <span class="nav-icon">👤</span>
            <span class="nav-label">Profile</span>
        </div>
    </div>
</nav>

<div class="controls">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search skill...">
    <button class="add-btn" onclick="openModal()">+ Add</button>
</div>

<div class="skills-grid" id="skillsContainer"></div>

<div class="modal" id="modal">
    <div class="modal-content">
        <h3>✨ New Skill</h3>
        <input id="name" placeholder="Skill name (e.g. Python, Guitar)">
        <select id="cat">
            <option value="">Category</option>
            <option>Programming</option>
            <option>Design</option>
            <option>Business</option>
            <option>Language</option>
            <option>Fitness</option>
            <option value="Other">Other</option>
        </select>
        <input id="otherCategory" placeholder="Custom category" style="display:none;">
        <textarea id="desc" rows="2" placeholder="Description (optional)"></textarea>
        <select id="type">
            <option value="teach">📖 Teach</option>
            <option value="learn">📚 Learn</option>
        </select>
        <input id="skillToTeach" placeholder="📖 What can you teach? (e.g. JavaScript)">
        <input id="skillToLearn" placeholder="📚 What do you want to learn? (e.g. Design)">
        <div class="modal-buttons">
            <button class="cancel-btn" onclick="resetForm()">Cancel</button>
            <button class="submit-btn" id="addBtn" onclick="addSkill()">Save</button>
        </div>
    </div>
</div>

<script>
    const API = "http://localhost:8080";

    function navigate(url) {
        sessionStorage.setItem('navigating', 'true');
        location.href = url;
    }

    const modeBtn = document.getElementById("modeBtn");
    if (localStorage.getItem("mode") === "dark") {
        document.body.classList.add("dark");
        modeBtn.innerText = "☀️";
    }
    function toggleMode() {
        document.body.classList.toggle("dark");
        const dark = document.body.classList.contains("dark");
        localStorage.setItem("mode", dark ? "dark" : "light");
        modeBtn.innerText = dark ? "☀️" : "🌙";
    }

    const modal         = document.getElementById("modal");
    const search        = document.getElementById("searchInput");
    const catFilter     = document.getElementById("catFilter");
    const sortFilter    = document.getElementById("sortFilter");
    const filtersBox    = document.getElementById("filtersBox");
    const nameInput     = document.getElementById("name");
    const cat           = document.getElementById("cat");
    const desc          = document.getElementById("desc");
    const type          = document.getElementById("type");
    const otherCategory = document.getElementById("otherCategory");

    let allSkills  = [];
    let editingId  = null;

    function getToken()      { return localStorage.getItem("token"); }
    function getCurrentUser() {
        const userId   = localStorage.getItem("userId");
        const username = localStorage.getItem("username");
        if (!userId) return null;
        return { id: parseInt(userId), username };
    }
    function authHeaders() {
        return {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${getToken()}`
        };
    }
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
    }
    function handleUnauthorized(res) {
        if (res.status === 401 || res.status === 403) {
            alert("Session expired. Please login again.");
            localStorage.removeItem("token");
            localStorage.removeItem("userId");
            localStorage.removeItem("username");
            location.href = "login.html";
            return true;
        }
        return false;
    }

    window.addEventListener('beforeunload', () => {
        const userId     = localStorage.getItem('userId');
        const navigating = sessionStorage.getItem('navigating');
        if (userId && !navigating) {
            navigator.sendBeacon(`${API}/presence/offline/${userId}`);
        }
        sessionStorage.removeItem('navigating');
    });

    async function loadSkills() {
        try {
            const res = await fetch(`${API}/api/skills`);
            if (!res.ok) throw new Error();
            allSkills = await res.json();
            updateDisplay();
        } catch (e) {
            document.getElementById("skillsContainer").innerHTML =
                `<div class="empty-state">⚠️ Could not load skills. Is the server running?</div>`;
        }
    }

    function updateDisplay() {
        let filtered = [...allSkills];
        const q = search.value.toLowerCase();
        if (q) filtered = filtered.filter(x => x.name.toLowerCase().includes(q));
        if (catFilter.value) {
            filtered = filtered.filter(x =>
                x.category?.toLowerCase() === catFilter.value.toLowerCase());
        }
        if (sortFilter.value === "az") filtered.sort((a, b) => a.name.localeCompare(b.name));
        if (sortFilter.value === "za") filtered.sort((a, b) => b.name.localeCompare(a.name));
        if (sortFilter.value === "pop") filtered.sort((a, b) => (b.popularity || 0) - (a.popularity || 0));
        displaySkills(filtered);
    }

    function displaySkills(skills) {
        const container = document.getElementById("skillsContainer");
        if (!skills.length) {
            container.innerHTML = `<div class="empty-state">✨ No skills found. Add one!</div>`;
            return;
        }
        const currentUser = getCurrentUser();
        const userId      = localStorage.getItem("userId");
        const likedSkills = JSON.parse(localStorage.getItem(`likedSkills_${userId}`) || "[]");
        container.innerHTML = skills.map(skill => {
            const user     = skill.user || {};
            const username = user.username || "Unknown";
            const isOwner  = currentUser && (skill.user?.id === currentUser.id);
            const isLiked  = likedSkills.includes(skill.id);
            return `
            <div class="skill-card" onclick="navigate('details.html?id=${skill.id}')">
                <div class="skill-name">${escapeHtml(skill.name)}</div>
                <div class="skill-category">#${escapeHtml(skill.category || "General")}</div>
                ${skill.description
                ? `<div class="skill-description">${escapeHtml(skill.description)}</div>`
                : ''}
                ${skill.skillToTeach ? `
                <div style="font-size:0.75rem; margin:4px 0; color:var(--text-light);">
                    📖 Teaches: <strong style="color:var(--text)">${escapeHtml(skill.skillToTeach)}</strong>
                </div>` : ''}
                ${skill.skillToLearn ? `
                <div style="font-size:0.75rem; margin:4px 0; color:var(--text-light);">
                    📚 Wants to learn: <strong style="color:var(--text)">${escapeHtml(skill.skillToLearn)}</strong>
                </div>` : ''}
                <div class="user-row">
                    <div class="user-info">
                        <div class="user-avatar">${(username.charAt(0) || "U").toUpperCase()}</div>
                        <div>
                            <div class="user-name">${escapeHtml(username)}</div>
                            <div>
                                <span class="online-dot ${user.online ? 'online' : 'offline'}"></span>
                                <span style="font-size:0.65rem;">${user.online ? 'Online' : 'Offline'}</span>
                            </div>
                        </div>
                    </div>
                    <div class="type-badge ${skill.type === 'teach' ? 'type-teach' : 'type-learn'}">
                        ${skill.type === 'teach' ? 'TEACH' : 'LEARN'}
                    </div>
                </div>
                <div class="card-footer">
                    <div class="popularity">🔥 ${skill.popularity || 0}</div>
                    <div class="action-group">
                        <button class="action-btn" title="${isLiked ? 'Already liked' : 'Like'}"
                            onclick="event.stopPropagation(); increasePopularity(${skill.id})"
                            style="${isLiked ? 'opacity:0.4; cursor:not-allowed;' : ''}">
                            ${isLiked ? '❤️' : '🤍'}
                        </button>
                        ${isOwner ? `
                        <button class="action-btn"
                            onclick="event.stopPropagation(); editSkill(${skill.id})">✏️</button>
                        <button class="action-btn"
                            onclick="event.stopPropagation(); deleteSkill(${skill.id})">🗑️</button>
                        ` : ''}
                    </div>
                </div>
            </div>`;
        }).join('');
    }

    async function addSkill() {
        const currentUser = getCurrentUser();
        if (!currentUser) { location.href = "login.html"; return; }

        const categoryValue = cat.value === "Other"
            ? otherCategory.value.trim()
            : cat.value;
        if (!nameInput.value.trim()) { alert("Enter skill name"); return; }

        const skill = {
            name:         nameInput.value.trim(),
            category:     categoryValue,
            description:  desc.value.trim(),
            type:         type.value,
            skillToTeach: document.getElementById("skillToTeach").value.trim(),
            skillToLearn: document.getElementById("skillToLearn").value.trim()
        };

        const btn = document.getElementById("addBtn");
        btn.disabled  = true;
        btn.innerText = "Saving...";

        try {
            const url    = editingId ? `${API}/api/skills/${editingId}` : `${API}/api/skills`;
            const method = editingId ? "PUT" : "POST";

            const res = await fetch(url, {
                method,
                headers: authHeaders(),
                body: JSON.stringify(skill)
            });

            if (handleUnauthorized(res)) return;
            if (!res.ok) { alert("Could not save skill"); return; }

            resetForm();
            await loadSkills();
        } catch (e) {
            alert("Connection error. Is the server running?");
        } finally {
            btn.disabled  = false;
            btn.innerText = "Save";
        }
    }

    async function deleteSkill(id) {
        if (!getCurrentUser()) { location.href = "login.html"; return; }
        if (!confirm("Delete this skill?")) return;
        try {
            const res = await fetch(`${API}/api/skills/${id}`, {
                method: "DELETE",
                headers: authHeaders()
            });
            if (handleUnauthorized(res)) return;
            if (!res.ok) { alert("Could not delete skill"); return; }
            await loadSkills();
        } catch (e) {
            alert("Connection error.");
        }
    }

    function editSkill(id) {
        if (!getCurrentUser()) { location.href = "login.html"; return; }
        // id comes as string from onclick attribute — parse it
        const skill = allSkills.find(s => s.id === parseInt(id));
        if (!skill) { alert("Skill not found"); return; }

        nameInput.value = skill.name;
        cat.value       = skill.category || "";
        desc.value      = skill.description || "";
        type.value      = skill.type || "teach";
        document.getElementById("skillToTeach").value = skill.skillToTeach || "";
        document.getElementById("skillToLearn").value = skill.skillToLearn || "";

        if (skill.category === "Other" || !["Programming","Design","Business","Language","Fitness",""].includes(skill.category)) {
            cat.value = "Other";
            otherCategory.style.display = "block";
            otherCategory.value = skill.category || "";
        } else {
            otherCategory.style.display = "none";
        }

        editingId = parseInt(id);
        modal.style.display = "flex";
    }

    async function increasePopularity(id) {
        if (!getCurrentUser()) {
            alert("Please login to like!");
            location.href = "login.html";
            return;
        }

        // ── Per-account like tracking ──
        const userId      = localStorage.getItem("userId");
        const storageKey  = `likedSkills_${userId}`;
        const likedSkills = JSON.parse(localStorage.getItem(storageKey) || "[]");

        if (likedSkills.includes(id)) {
            alert("You already liked this skill! ❤️");
            return;
        }

        try {
            const res = await fetch(`${API}/api/skills/${id}/increase`, {
                method: "PUT",
                headers: authHeaders()
            });
            if (handleUnauthorized(res)) return;
            if (res.ok) {
                // Save liked skill per user account
                likedSkills.push(id);
                localStorage.setItem(storageKey, JSON.stringify(likedSkills));
                await loadSkills();
            }
        } catch (e) {
            console.error("Like failed", e);
        }
    }

    function openModal() {
        if (!getCurrentUser()) {
            alert("Please login first!");
            location.href = "login.html";
            return;
        }
        resetForm();
        modal.style.display = "flex";
    }

    function resetForm() {
        modal.style.display = "none";
        editingId           = null;
        nameInput.value     = "";
        cat.value           = "";
        desc.value          = "";
        type.value          = "teach";
        otherCategory.value = "";
        otherCategory.style.display = "none";
        document.getElementById("skillToTeach").value = "";
        document.getElementById("skillToLearn").value = "";
    }

    function toggleFilters() {
        filtersBox.style.display =
            filtersBox.style.display === "flex" ? "none" : "flex";
    }

    cat.onchange = () => {
        otherCategory.style.display = cat.value === "Other" ? "block" : "none";
    };

    function loadUser() {
        const username = localStorage.getItem("username");
        if (!username) {
            document.getElementById("navUser").innerHTML =
                `<button class="btn" onclick="navigate('login.html')">🔐 Login</button>`;
        } else {
            document.getElementById("navUser").innerHTML =
                `<span style="color:var(--primary); font-weight:bold; cursor:pointer;"
                       onclick="logout()">👋 ${escapeHtml(username)} (logout)</span>`;
        }
    }

    async function logout() {
        const userId = localStorage.getItem('userId');
        if (userId) navigator.sendBeacon(`${API}/presence/offline/${userId}`);
        try {
            await fetch(`${API}/api/users/logout`, { method: "POST", headers: authHeaders() });
        } catch (_) {}
        localStorage.removeItem("token");
        localStorage.removeItem("userId");
        localStorage.removeItem("username");
        localStorage.removeItem("email");
        location.href = "login.html";
    }

    // ── MOBILE NAV ──
    function toggleMobileNav() {
        document.getElementById("mobileNav").classList.toggle("open");
    }
    function closeMobileNav() {
        document.getElementById("mobileNav").classList.remove("open");
    }
    // Close mobile nav when clicking outside
    document.addEventListener('click', function(e) {
        const nav = document.getElementById("mobileNav");
        const hamburger = document.querySelector(".hamburger");
        if (nav.classList.contains("open") && !nav.contains(e.target) && !hamburger.contains(e.target)) {
            closeMobileNav();
        }
    });

    // ── LIVE COIN BALANCE ──
    async function loadCoinBalance() {
        if (!getToken()) return;
        try {
            const res = await fetch(`${API}/api/coins/balance`, { headers: authHeaders() });
            if (res.ok) {
                const data = await res.json();
                const bal  = data.balance ?? 0;
                document.getElementById("navCoinCount").textContent = bal;
                const mc = document.getElementById("mobileCoins");
                if (mc) mc.textContent = "🪙 " + bal;
            }
        } catch(e) {
            document.getElementById("navCoinCount").textContent = "0";
        }
    }

    // ── UNREAD CHAT COUNT ──
    async function loadUnreadCount() {
        if (!getToken()) return;
        try {
            const res = await fetch(`${API}/api/messages/unread/count`, { headers: authHeaders() });
            if (res.ok) {
                const data  = await res.json();
                const count = data.count ?? 0;
                // Top navbar badge
                const badge = document.getElementById("chatBadge");
                // Bottom nav badge
                const bottomBadge = document.getElementById("bottomChatBadge");
                if (count > 0) {
                    const label = count > 99 ? "99+" : count;
                    if (badge) { badge.textContent = label; badge.style.display = "flex"; }
                    if (bottomBadge) { bottomBadge.textContent = label; bottomBadge.style.display = "flex"; }
                } else {
                    if (badge) badge.style.display = "none";
                    if (bottomBadge) bottomBadge.style.display = "none";
                }
            }
        } catch(e) { /* ignore if endpoint not ready */ }
    }

    search.oninput      = updateDisplay;
    catFilter.onchange  = updateDisplay;
    sortFilter.onchange = updateDisplay;

    loadSkills();
    loadUser();
    loadCoinBalance();
    loadUnreadCount();
    setInterval(loadUnreadCount, 15000);

    // ── VIEW TOGGLE (desktop ↔ mobile simulation) ──
    const viewBtn = document.getElementById("viewToggleBtn");
    function applyViewMode() {
        const isMobile = localStorage.getItem("viewMode") === "mobile";
        if (isMobile) {
            document.body.classList.add("mobile-view");
            viewBtn.textContent = "🖥️";
            viewBtn.setAttribute("data-tip", "Desktop view");
        } else {
            document.body.classList.remove("mobile-view");
            viewBtn.textContent = "📱";
            viewBtn.setAttribute("data-tip", "Mobile view");
        }
    }
    function toggleView() {
        const isMobile = localStorage.getItem("viewMode") === "mobile";
        localStorage.setItem("viewMode", isMobile ? "desktop" : "mobile");
        applyViewMode();
    }
    applyViewMode();
</script>

<!-- View toggle floating button -->
<button class="view-toggle-btn" id="viewToggleBtn" onclick="toggleView()" data-tip="Mobile view">📱</button>

</body>
</html>
