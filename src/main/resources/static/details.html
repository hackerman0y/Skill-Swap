<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Skill Details</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="navbar">
    <h2 onclick="navigate('index.html')">SkillSwap</h2>
    <div class="nav-right">
        <!-- FIX 6: use navigate() not location.href directly -->
        <span class="profile" onclick="navigate('profile.html')">👤</span>
        <button class="mode-btn" id="modeBtn" onclick="toggleMode()">🌙</button>
        <button class="btn-back" onclick="navigate('index.html')">← Back</button>
    </div>
</div>

<div class="details-container">
    <div class="details-card" id="details">Loading...</div>
</div>

<footer>
    © 2026 SkillSwap — Learn & Teach Skills Easily 🚀
</footer>

<script>
    const API = "http://localhost:8080";

    // ── FIX 6: Always use navigate() so offline beacon isn't falsely triggered ──
    function navigate(url) {
        sessionStorage.setItem('navigating', 'true');
        location.href = url;
    }

    // ── Dark mode ──
    const modeBtn = document.getElementById("modeBtn");
    if (localStorage.getItem("mode") === "dark") {
        document.body.classList.add("dark");
        modeBtn.innerText = "☀️";
    }
    function toggleMode() {
        document.body.classList.toggle("dark");
        const dark = document.body.classList.contains("dark");
        localStorage.setItem("mode", dark ? "dark" : "light");
        modeBtn.innerText = dark ? "☀️" : "🌙";
    }

    const params = new URLSearchParams(window.location.search);
    const id     = params.get("id");

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m =>
            m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'
        );
    }

    function authHeaders() {
        const token = localStorage.getItem("token");
        return {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
        };
    }

    const container = document.getElementById("details");

    if (!id) {
        container.innerHTML = "<h3>Invalid skill</h3>";
    } else {
        fetch(`${API}/api/skills/${id}`)
            .then(res => {
                if (!res.ok) throw new Error();
                return res.json();
            })
            .then(skill => {
                const user = skill.user || {};

                // ── FIX 8: Only ONE like button here, no duplicate ──
                container.innerHTML = `
                    <h2>${escapeHtml(skill.name)}</h2>

                    <p><b>Category:</b> ${escapeHtml(skill.category)}</p>

                    <div class="type-badge ${skill.type === 'teach' ? 'type-teach' : 'type-learn'}"
                         style="display:inline-block; margin:10px 0;">
                        ${skill.type === 'teach' ? 'TEACH' : 'LEARN'}
                    </div>

                    <p>${escapeHtml(skill.description || "")}</p>

                    <p>🔥 Popularity: <span id="popCount">${skill.popularity || 0}</span></p>

                    <button
                        onclick="likeSkill(${skill.id})"
                        style="margin-top:10px; padding:8px 20px; border-radius:20px;
                               background:var(--primary); color:white; border:none; cursor:pointer;">
                        ❤️ Like
                    </button>

                    <div class="user-info-detail">
                        <div class="detail-avatar">
                            ${(user.username?.charAt(0) || "U").toUpperCase()}
                        </div>
                        <div>
                            <div><b>${escapeHtml(user.username || "Unknown")}</b></div>
                            <div class="online-status">
                                ${user.online ? '🟢 Online' : '⚫ Offline'}
                            </div>
                        </div>
                    </div>
                `;
            })
            .catch(() => {
                container.innerHTML = "<h3>Skill not found</h3>";
            });
    }

    async function likeSkill(skillId) {
        const token = localStorage.getItem("token");
        if (!token) {
            alert("Please login to like!");
            navigate('login.html');
            return;
        }
        try {
            const res = await fetch(`${API}/api/skills/${skillId}/increase`, {
                method: "PUT",
                headers: authHeaders()
            });
            if (res.ok) {
                const updated = await res.json();
                const popEl = document.getElementById("popCount");
                if (popEl) popEl.textContent = updated.popularity || 0;
            }
        } catch (e) {
            console.error("Like failed", e);
        }
    }

    // ── Cleanup ──
    window.addEventListener('beforeunload', () => {
        const userId    = localStorage.getItem('userId');
        const navigating = sessionStorage.getItem('navigating');
        if (userId && !navigating) {
            navigator.sendBeacon(`${API}/presence/offline/${userId}`);
        }
        sessionStorage.removeItem('navigating');
    });
</script>

</body>
</html>
