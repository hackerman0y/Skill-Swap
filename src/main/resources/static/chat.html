<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SkillSwap - Chat</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* ── HEADER ── */
        .chat-header {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 18px; background: var(--card);
            border-bottom: 1px solid var(--border); flex-shrink: 0;
        }
        .back-btn {
            background: transparent; border: none; font-size: 1.2rem;
            cursor: pointer; color: var(--primary); padding: 4px 8px;
        }
        .recipient-avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--primary);
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: bold; font-size: 1rem;
            position: relative; flex-shrink: 0;
        }
        .recipient-online-dot {
            position: absolute; bottom: 1px; right: 1px;
            width: 10px; height: 10px; border-radius: 50%;
            background: #64748b; border: 2px solid var(--card);
        }
        .recipient-online-dot.is-online { background: #10b981; }
        .recipient-info { flex: 1; }
        .recipient-name   { font-weight: 600; font-size: 0.95rem; color: var(--text); }
        .recipient-status { font-size: 0.75rem; color: var(--text-light); }

        /* Only show online status text when actually online */
        .recipient-status.is-online { color: #10b981; font-weight: 600; }

        .header-mode-btn {
            background: transparent; border: 2px solid var(--primary);
            color: var(--primary); padding: 6px 10px; border-radius: 10px;
            cursor: pointer; font-size: 14px;
        }

        /* ── MESSAGES AREA ── */
        .messages-area {
            flex: 1; overflow-y: auto; padding: 16px;
            display: flex; flex-direction: column; gap: 4px;
            background: var(--bg);
        }

        .message-row { display: flex; flex-direction: column; position: relative; }
        .message-row.sent     { align-items: flex-end; }
        .message-row.received { align-items: flex-start; }

        /* ── REPLY PREVIEW (inside bubble) ── */
        .reply-preview {
            background: rgba(0,0,0,0.08);
            border-left: 3px solid rgba(255,255,255,0.5);
            border-radius: 8px;
            padding: 5px 10px;
            margin-bottom: 4px;
            font-size: 0.75rem;
            opacity: 0.85;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .message-row.received .reply-preview {
            background: rgba(108,99,255,0.08);
            border-left-color: var(--primary);
        }

        .bubble {
            max-width: 72%; padding: 9px 14px;
            border-radius: 18px; font-size: 0.88rem;
            line-height: 1.45; word-break: break-word;
            cursor: pointer;
            transition: opacity 0.15s;
        }
        .bubble:hover { opacity: 0.88; }

        .message-row.sent .bubble {
            background: var(--primary); color: white;
            border-bottom-right-radius: 4px;
        }
        .message-row.received .bubble {
            background: var(--card); color: var(--text);
            border: 1px solid var(--border);
            border-bottom-left-radius: 4px;
        }

        .bubble-footer {
            display: flex; align-items: center; gap: 5px;
            margin-top: 3px; padding: 0 4px;
        }
        .bubble-time { font-size: 0.65rem; color: var(--text-light); }
        .seen-receipt { font-size: 0.65rem; color: var(--primary); font-weight: 600; }

        /* ── REPLY HOVER BUTTON ── */
        .reply-btn {
            display: none;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 3px 10px;
            font-size: 0.72rem;
            cursor: pointer;
            color: var(--text-light);
            position: absolute;
            top: 0;
            transition: all 0.15s;
        }
        .message-row.sent     .reply-btn { left: 8px; }
        .message-row.received .reply-btn { right: 8px; }
        .message-row:hover .reply-btn { display: block; }
        .reply-btn:hover { background: var(--primary); color: white; border-color: var(--primary); }

        /* ── REPLY BAR (above input) ── */
        .reply-bar {
            display: none; align-items: center; gap: 10px;
            padding: 8px 16px;
            background: var(--card);
            border-top: 1px solid var(--border);
            font-size: 0.82rem;
        }
        .reply-bar.visible { display: flex; }
        .reply-bar-content {
            flex: 1; color: var(--text-light);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .reply-bar-content strong { color: var(--primary); }
        .reply-bar-close {
            background: transparent; border: none; cursor: pointer;
            font-size: 1rem; color: var(--text-light); flex-shrink: 0;
        }
        .reply-bar-close:hover { color: var(--danger); }

        /* ── TYPING ── */
        .typing-indicator { display: none; align-items: flex-start; gap: 8px; padding: 4px 0; }
        .typing-indicator.visible { display: flex; }
        .typing-dots {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 18px; border-bottom-left-radius: 4px;
            padding: 10px 16px; display: flex; gap: 4px; align-items: center;
        }
        .dot { width: 7px; height: 7px; background: var(--text-light); border-radius: 50%; animation: bounce 1.2s infinite; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-6px)} }

        /* ── DATE SEP ── */
        .date-sep {
            text-align: center; font-size: 0.72rem;
            color: var(--text-light); margin: 10px 0; position: relative;
        }
        .date-sep::before, .date-sep::after {
            content: ''; position: absolute; top: 50%;
            width: 35%; height: 1px; background: var(--border);
        }
        .date-sep::before { left: 0; }
        .date-sep::after  { right: 0; }

        /* ── INPUT BAR ── */
        .input-bar {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 16px; background: var(--card);
            border-top: 1px solid var(--border); flex-shrink: 0;
        }
        .msg-input {
            flex: 1; padding: 10px 16px;
            border: 1.5px solid var(--border); border-radius: 24px;
            background: var(--bg); color: var(--text);
            font-size: 0.88rem; outline: none;
            transition: border-color 0.2s; resize: none; font-family: inherit;
        }
        .msg-input:focus { border-color: var(--primary); }
        .send-btn {
            width: 42px; height: 42px; border-radius: 50%;
            background: var(--primary); border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; flex-shrink: 0; transition: opacity 0.2s, transform 0.1s;
        }
        .send-btn:hover  { opacity: 0.9; transform: scale(1.05); }
        .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ── WS STATUS ── */
        .ws-status { text-align: center; font-size: 0.72rem; padding: 4px 10px; background: var(--bg); color: var(--text-light); border-bottom: 1px solid var(--border); }
        .ws-status.connected { color: #10b981; background: rgba(16,185,129,0.07); }
        .ws-status.error     { color: var(--danger); background: rgba(239,68,68,0.07); }

        .empty-messages { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-light); gap: 8px; }
        .empty-messages span { font-size: 2.5rem; }
        .empty-messages p { font-size: 0.88rem; }
    </style>
</head>
<body>

<div class="chat-header">
    <button class="back-btn" onclick="navigate('chat-list.html')">←</button>
    <button class="back-btn" onclick="navigate('index.html')">🏠</button>
    <div class="recipient-avatar" id="recipientAvatar">
        <span id="recipientInitial">?</span>
        <div class="recipient-online-dot" id="recipientOnlineDot"></div>
    </div>
    <div class="recipient-info">
        <div class="recipient-name" id="recipientName">Loading...</div>
        <!-- Online status — only shown when actually online -->
        <div class="recipient-status" id="recipientStatus"></div>
    </div>
    <button class="header-mode-btn" id="modeBtn" onclick="toggleMode()">🌙</button>
</div>

<div class="ws-status" id="wsStatus">Connecting to chat...</div>

<div class="messages-area" id="messagesArea">
    <div class="empty-messages" id="emptyState">
        <span>💬</span>
        <p>Say hello!</p>
    </div>
    <div class="typing-indicator" id="typingIndicator">
        <div class="typing-dots">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
    </div>
</div>

<!-- Reply bar (shows above input when replying) -->
<div class="reply-bar" id="replyBar">
    <div class="reply-bar-content" id="replyBarContent">
        Replying to: <strong id="replyBarText"></strong>
    </div>
    <button class="reply-bar-close" onclick="cancelReply()">✕</button>
</div>

<div class="input-bar">
    <textarea class="msg-input" id="msgInput" placeholder="Type a message..." rows="1" maxlength="1000"></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>➤</button>
</div>

<script>
    const API           = "http://localhost:8080";
    const token         = localStorage.getItem("token");
    const currentUserId = localStorage.getItem("userId");
    const currentUsername = localStorage.getItem("username");

    if (!token) { location.href = "login.html"; }

    const params            = new URLSearchParams(window.location.search);
    const recipientId       = params.get("userId");
    const recipientUsername = params.get("username") || "User";

    if (!recipientId) { location.href = "chat-list.html"; }

    const messagesArea    = document.getElementById("messagesArea");
    const msgInput        = document.getElementById("msgInput");
    const sendBtn         = document.getElementById("sendBtn");
    const wsStatus        = document.getElementById("wsStatus");
    const typingIndicator = document.getElementById("typingIndicator");
    const emptyState      = document.getElementById("emptyState");

    document.getElementById("recipientName").textContent    = recipientUsername;
    document.getElementById("recipientInitial").textContent = recipientUsername.charAt(0).toUpperCase();

    // ── Dark mode ──
    const modeBtn = document.getElementById("modeBtn");
    if (localStorage.getItem("mode") === "dark") { document.body.classList.add("dark"); modeBtn.innerText = "☀️"; }
    function toggleMode() {
        document.body.classList.toggle("dark");
        const dark = document.body.classList.contains("dark");
        localStorage.setItem("mode", dark ? "dark" : "light");
        modeBtn.innerText = dark ? "☀️" : "🌙";
    }

    function navigate(url) { sessionStorage.setItem('navigating', 'true'); location.href = url; }
    function authHeaders() { return { "Authorization": `Bearer ${token}`, "Content-Type": "application/json" }; }
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
    }
    function formatTime(isoString) {
        if (!isoString) return '';
        return new Date(isoString).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    // ── Reply state ──
    let replyingTo = null; // { content, sender }

    function startReply(content, sender) {
        replyingTo = { content, sender };
        document.getElementById("replyBarText").textContent =
            (sender === currentUsername ? 'yourself' : sender) + ': ' + content.slice(0, 50);
        document.getElementById("replyBar").classList.add("visible");
        msgInput.focus();
    }

    function cancelReply() {
        replyingTo = null;
        document.getElementById("replyBar").classList.remove("visible");
        document.getElementById("replyBarText").textContent = '';
    }

    // ── Render a message bubble ──
    function renderMessage(msg, type) {
        emptyState.style.display = 'none';
        typingIndicator.remove();

        const row = document.createElement('div');
        row.className = `message-row ${type}`;

        const content   = msg.content || msg.text || '';
        const time      = formatTime(msg.timestamp || new Date().toISOString());
        const isSent    = type === 'sent';
        const isRead    = msg.isRead;
        const replyText = msg.replyTo || null;

        row.innerHTML = `
            <button class="reply-btn" onclick="startReply('${escapeHtml(content).replace(/'/g,"\\'")}', '${escapeHtml(msg.sender || '')}')">↩ Reply</button>
            <div class="bubble" onclick="startReply('${escapeHtml(content).replace(/'/g,"\\'")}', '${escapeHtml(msg.sender || '')}')">
                ${replyText ? `<div class="reply-preview">↩ ${escapeHtml(replyText)}</div>` : ''}
                ${escapeHtml(content)}
            </div>
            <div class="bubble-footer">
                <span class="bubble-time">${time}</span>
                ${isSent ? `<span class="seen-receipt" id="seen-${msg.id || Date.now()}">${isRead ? '✓✓ Seen' : '✓ Sent'}</span>` : ''}
            </div>
        `;

        messagesArea.appendChild(row);
        messagesArea.appendChild(typingIndicator);
        scrollToBottom();
    }

    function scrollToBottom() { messagesArea.scrollTop = messagesArea.scrollHeight; }

    // ── WebSocket ──
    let stompClient   = null;
    let typingTimeout = null;

    function connectWebSocket() {
        wsStatus.textContent = 'Connecting...';
        wsStatus.className   = 'ws-status';
        try {
            const socket = new SockJS(`${API}/ws`);
            stompClient = new StompJs.Client({
                webSocketFactory: () => socket,
                connectHeaders: { Authorization: 'Bearer ' + token },
                reconnectDelay: 5000,

                onConnect: function () {
                    wsStatus.textContent = '✓ Connected';
                    wsStatus.className   = 'ws-status connected';
                    sendBtn.disabled     = false;

                    // Receive messages
                    stompClient.subscribe('/user/' + currentUsername + '/queue/messages', function (frame) {
                        const msg = JSON.parse(frame.body);
                        if (String(msg.sender) === String(recipientId) || msg.sender === recipientUsername) {
                            renderMessage(msg, 'received');
                            // Mark as read immediately since chat is open
                            markAsRead();
                        }
                    });

                    // Typing
                    stompClient.subscribe('/user/' + currentUsername + '/queue/typing', function (frame) {
                        const data = JSON.parse(frame.body);
                        if (String(data.senderId) === String(recipientId)) showTyping();
                    });

                    // Seen receipt — when recipient reads our messages
                    stompClient.subscribe('/user/' + currentUsername + '/queue/seen', function (frame) {
                        const data = JSON.parse(frame.body);
                        if (String(data.senderId) === String(recipientId) || data.sender === recipientUsername) {
                            // Update all "✓ Sent" to "✓✓ Seen"
                            document.querySelectorAll('.seen-receipt').forEach(el => {
                                if (el.textContent.includes('Sent')) el.textContent = '✓✓ Seen';
                            });
                        }
                    });

                    loadChatHistory();
                    checkRecipientStatus();
                    setInterval(checkRecipientStatus, 30000);
                },

                onDisconnect: function () {
                    wsStatus.textContent = '⚠ Disconnected — reconnecting...';
                    wsStatus.className   = 'ws-status error';
                    sendBtn.disabled     = true;
                    setRecipientOffline();
                },
                onStompError: function () {
                    wsStatus.textContent = '✗ Connection error';
                    wsStatus.className   = 'ws-status error';
                    sendBtn.disabled     = true;
                }
            });
            stompClient.activate();
        } catch (e) {
            wsStatus.textContent = '✗ Could not connect to WebSocket';
            wsStatus.className   = 'ws-status error';
        }
    }

    // ── Send message ──
    function sendMessage() {
        const content = msgInput.value.trim();
        if (!content || !stompClient || !stompClient.connected) return;

        const message = {
            sender:    currentUsername,
            receiver:  recipientUsername,
            content:   content,
            text:      content,
            timestamp: new Date().toISOString(),
            replyTo:   replyingTo ? replyingTo.content : null
        };

        stompClient.publish({ destination: '/app/chat', body: JSON.stringify(message) });
        renderMessage(message, 'sent');
        cancelReply();
        msgInput.value        = '';
        msgInput.style.height = 'auto';
    }

    // ── Mark messages as read ──
    async function markAsRead() {
        try {
            await fetch(`${API}/api/messages/${recipientId}/read`, {
                method: "PUT", headers: authHeaders()
            });
            // Notify sender via WebSocket that we've seen the messages
            if (stompClient && stompClient.connected) {
                stompClient.publish({
                    destination: '/app/chat.seen',
                    body: JSON.stringify({ senderId: currentUserId, receiverId: recipientId, sender: currentUsername })
                });
            }
        } catch(e) {}
    }

    // ── Typing indicator ──
    let typingTimer = null;
    function showTyping() {
        typingIndicator.classList.add('visible');
        scrollToBottom();
        clearTimeout(typingTimer);
        typingTimer = setTimeout(() => typingIndicator.classList.remove('visible'), 2500);
    }
    function handleTyping() {
        if (!stompClient || !stompClient.connected) return;
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => {
            stompClient.publish({
                destination: '/app/chat.typing',
                body: JSON.stringify({ senderId: currentUserId, receiverId: recipientId })
            });
        }, 300);
    }

    // ── Load chat history ──
    async function loadChatHistory() {
        try {
            const res = await fetch(`${API}/api/messages/${recipientId}`, { headers: authHeaders() });
            if (!res.ok) return;
            const messages = await res.json();
            if (!messages || !messages.length) return;

            emptyState.style.display = 'none';
            const sep = document.createElement('div');
            sep.className   = 'date-sep';
            sep.textContent = 'Earlier';
            messagesArea.insertBefore(sep, typingIndicator);

            messages.forEach(msg => {
                const isMine = String(msg.sender) === String(currentUsername);
                renderMessage(msg, isMine ? 'sent' : 'received');
            });

            // Mark as read after loading
            await markAsRead();
        } catch (e) { console.warn('Could not load history:', e); }
    }

    // ── Online status — only show "Online" when ACTUALLY online ──
    function setRecipientOnline() {
        const dot    = document.getElementById('recipientOnlineDot');
        const status = document.getElementById('recipientStatus');
        dot.classList.add('is-online');
        status.textContent = 'Online';
        status.className   = 'recipient-status is-online';
    }

    function setRecipientOffline() {
        const dot    = document.getElementById('recipientOnlineDot');
        const status = document.getElementById('recipientStatus');
        dot.classList.remove('is-online');
        status.textContent = ''; // ← empty when offline, not showing "Offline"
        status.className   = 'recipient-status';
    }

    async function checkRecipientStatus() {
        try {
            const res = await fetch(`${API}/api/users/${recipientId}`, { headers: authHeaders() });
            if (!res.ok) return;
            const user = await res.json();
            if (user.online) setRecipientOnline();
            else setRecipientOffline();
        } catch (e) {}
    }

    // ── Input events ──
    msgInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    msgInput.addEventListener('input', function () {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        handleTyping();
    });

    // ── Cleanup ──
    window.addEventListener('beforeunload', () => {
        const navigating = sessionStorage.getItem('navigating');
        if (currentUserId && !navigating) navigator.sendBeacon(`${API}/presence/offline/${currentUserId}`);
        sessionStorage.removeItem('navigating');
        if (stompClient) stompClient.deactivate();
    });

    checkRecipientStatus();
    connectWebSocket();
</script>
</body>
</html>
