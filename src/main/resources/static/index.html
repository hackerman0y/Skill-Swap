<!DOCTYPE html>
<html lang="en">

<style>
    .nav-icon-btn { width:52px !important; height:52px !important; }
    .nav-icon-btn svg { width:45px !important; height:45px !important; }
    .nav-actions { gap:4px !important; }
</style>
<head>
    <meta charset="UTF-8">
    <title>SkillSwap</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .navbar { padding: 0 24px; height: 62px; gap: 0; }

        .nav-logo { display:flex; align-items:center; gap:9px; cursor:pointer; flex-shrink:0; }
        .nav-logo-icon {
            width:32px; height:32px;
            background:linear-gradient(135deg,var(--primary),var(--primary-light));
            border-radius:10px; display:flex; align-items:center; justify-content:center;
            font-size:1rem; box-shadow:0 2px 8px rgba(108,99,255,0.35); flex-shrink:0;
        }
        .nav-logo-text { font-size:1.05rem; font-weight:800; color:var(--text); letter-spacing:-0.4px; }
        .nav-logo-text span { color:var(--primary); }

        .nav-center { display:flex; align-items:center; gap:2px; margin:0 auto; }

        .nav-link {
            display:flex; align-items:center; gap:6px; padding:7px 12px;
            border-radius:10px; border:none; background:transparent;
            color:var(--text-light); font-size:0.82rem; font-weight:600;
            cursor:pointer; transition:all 0.15s; white-space:nowrap; font-family:inherit;
        }
        .nav-link svg { width:16px; height:16px; flex-shrink:0; }
        .nav-link:hover { background:rgba(108,99,255,0.08); color:var(--primary); }
        .nav-link.active { color:var(--primary); background:rgba(108,99,255,0.1); }

        .nav-actions { display:flex; align-items:center; gap:6px; flex-shrink:0; }

        .coin-badge {
            display:flex; align-items:center; gap:5px;
            background:linear-gradient(135deg,#f59e0b,#d97706);
            color:white; padding:5px 12px; border-radius:20px;
            font-size:0.78rem; font-weight:700; cursor:pointer;
            box-shadow:0 2px 8px rgba(245,158,11,0.3); transition:opacity 0.2s;
        }
        .coin-badge:hover { opacity:0.9; }

        .nav-icon-btn {
            position:relative; width:36px; height:36px; border-radius:10px;
            border:none; background:transparent; color:var(--text-light);
            cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all 0.15s;
        }
        .nav-icon-btn svg { width:18px; height:18px; }
        .nav-icon-btn:hover { background:rgba(108,99,255,0.08); color:var(--primary); }

        .nav-badge {
            position:absolute; top:2px; right:2px; min-width:16px; height:16px;
            background:#ef4444; color:white; border-radius:20px;
            font-size:0.58rem; font-weight:700;
            display:none; align-items:center; justify-content:center;
            border:2px solid var(--card); padding:0 3px;
        }

        .nav-divider { width:1px; height:22px; background:var(--border); margin:0 4px; flex-shrink:0; }

        .mode-toggle {
            width:36px; height:36px; border-radius:10px;
            border:1.5px solid var(--border); background:transparent;
            color:var(--text-light); cursor:pointer;
            display:flex; align-items:center; justify-content:center;
            font-size:0.95rem; transition:all 0.15s;
        }
        .mode-toggle:hover { border-color:var(--primary); color:var(--primary); }

        .nav-user-pill {
            display:flex; align-items:center; gap:7px;
            padding:5px 12px 5px 6px; border-radius:20px;
            border:1.5px solid var(--border); cursor:pointer;
            transition:all 0.15s; color:var(--text); font-size:0.8rem; font-weight:600;
            position:relative;
        }
        .nav-user-pill:hover { border-color:var(--primary); color:var(--primary); }
        .nav-user-avatar {
            width:24px; height:24px; border-radius:8px;
            background:linear-gradient(135deg,var(--primary),var(--primary-light));
            color:white; font-size:0.68rem; font-weight:700;
            display:flex; align-items:center; justify-content:center; flex-shrink:0;
        }

        /* User dropdown */
        .user-dropdown {
            position:absolute; top:calc(100% + 8px); right:0;
            background:var(--card); border:1.5px solid var(--border);
            border-radius:14px; padding:6px;
            box-shadow:0 8px 24px rgba(0,0,0,0.12);
            min-width:160px; z-index:300;
            display:none; flex-direction:column; gap:2px;
            animation:dropIn 0.15s ease;
        }
        @keyframes dropIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:translateY(0)} }
        .user-dropdown.open { display:flex; }

        .dropdown-item {
            display:flex; align-items:center; gap:9px;
            padding:9px 12px; border-radius:10px; cursor:pointer;
            font-size:0.82rem; font-weight:600; color:var(--text);
            transition:all 0.12s; border:none; background:transparent;
            font-family:inherit; width:100%; text-align:left;
        }
        .dropdown-item:hover { background:rgba(108,99,255,0.08); color:var(--primary); }
        .dropdown-item.danger { color:var(--danger); }
        .dropdown-item.danger:hover { background:rgba(239,68,68,0.08); color:var(--danger); }
        .dropdown-divider { height:1px; background:var(--border); margin:4px 0; }

        .filters-box { top:66px; right:20px; }

        @media (max-width:960px) { .nav-center { display:none; } }
        @media (max-width:768px) { .navbar { padding:0 14px; } }
    </style>
</head>
<body>

    <div class="nav-logo" onclick="navigate('index.html')">

        <div class="nav-logo-text">Skill<span>Swap</span></div>

        <button class="nav-link" onclick="navigate('contact.html')">

    </nav>

    <div class="nav-actions">
        <div class="coin-badge" onclick="navigate('store.html')" title="Store">🪙 <span id="navCoinCount">—</span></div>

        <button class="nav-icon-btn" onclick="navigate('store.html')" title="Store">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        </button>

        <button class="nav-icon-btn" onclick="navigate('chat-list.html')" title="Messages">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span class="nav-badge" id="chatBadge"></span>
        </button>

        <button class="nav-icon-btn" onclick="navigate('notifications.html')" title="Notifications">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        </button>

        <button class="nav-icon-btn" onclick="toggleFilters()" title="Filter">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="11" y1="18" x2="13" y2="18"/></svg>
        </button>

        <div id="filtersBox" class="filters-box">
            <select id="catFilter"><option value="">All Categories</option><option>Programming</option><option>Design</option><option>Business</option><option>Language</option><option>Fitness</option></select>
            <select id="sortFilter"><option value="">Sort by</option><option value="az">A → Z</option><option value="za">Z → A</option><option value="pop">🔥 Popular</option></select>
        </div>

        <div class="nav-divider"></div>
        <div id="navUser"></div>
        <button class="mode-toggle" id="modeBtn" onclick="toggleMode()">🌙</button>
        <button class="hamburger" onclick="toggleMobileNav()" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
</div>

<div class="mobile-nav" id="mobileNav">
    <span onclick="navigate('index.html'); closeMobileNav()">🏠 Home</span>
    <span onclick="navigate('swaps.html'); closeMobileNav()">🔄 Swaps</span>
    <span onclick="navigate('sessions.html'); closeMobileNav()">📅 Sessions</span>
    <span onclick="navigate('store.html'); closeMobileNav()">🛍️ Store &nbsp;<span id="mobileCoins" style="background:linear-gradient(135deg,#f59e0b,#d97706);color:white;padding:2px 8px;border-radius:20px;font-size:0.75rem;font-weight:700;">—</span></span>
    <span onclick="navigate('chat-list.html'); closeMobileNav()">💬 Messages</span>
    <span onclick="navigate('notifications.html'); closeMobileNav()">🔔 Notifications</span>
    <span onclick="navigate('profile.html'); closeMobileNav()">👤 Profile</span>
    <span onclick="navigate('about.html'); closeMobileNav()">ℹ️ About</span>
    <span onclick="navigate('contact.html'); closeMobileNav()">✉️ Contact</span>
    <span onclick="closeMobileNav(); logout()" style="color:var(--danger);">🚪 Logout</span>
</div>

<nav class="bottom-nav">
    <div class="bottom-nav-inner">
        <div class="bottom-nav-item active" onclick="navigate('index.html')">
            <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
            <span class="nav-label">Home</span>
        </div>
        <div class="bottom-nav-item" onclick="navigate('chat-list.html')">
            <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>

            <span class="bottom-nav-badge" id="bottomChatBadge" style="display:none;"></span>

        <div class="bottom-nav-item" onclick="openModal()">
            <span class="nav-icon" style="color:var(--primary);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></span>

            <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg></span>
            <span class="nav-label">Store</span>
        </div>
        <div class="bottom-nav-item" onclick="navigate('profile.html')">
            <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
            <span class="nav-label">Profile</span>

</nav>

<div class="controls">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search skill...">
    <button class="add-btn" onclick="openModal()">+ Add</button>
</div>

<div class="skills-grid" id="skillsContainer"></div>

<div class="modal" id="modal">
    <div class="modal-content">
        <h3>✨ New Skill</h3>
        <input id="name" placeholder="Skill name (e.g. Python, Guitar)">
        <select id="cat"><option value="">Category</option><option>Programming</option><option>Design</option><option>Business</option><option>Language</option><option>Fitness</option><option value="Other">Other</option></select>
        <input id="otherCategory" placeholder="Custom category" style="display:none;">
        <textarea id="desc" rows="2" placeholder="Description (optional)"></textarea>
        <select id="type"><option value="teach">📖 Teach</option><option value="learn">📚 Learn</option></select>
        <input id="skillToTeach" placeholder="📖 What can you teach? (e.g. JavaScript)">
        <input id="skillToLearn" placeholder="📚 What do you want to learn? (e.g. Design)">
        <div class="modal-buttons">
            <button class="cancel-btn" onclick="resetForm()">Cancel</button>
            <button class="submit-btn" id="addBtn" onclick="addSkill()">Save</button>
        </div>
    </div>
</div>

<button class="view-toggle-btn" id="viewToggleBtn" onclick="toggleView()" data-tip="Mobile view">📱</button>

<script>
    const API = "http://localhost:8080";
    function navigate(url) { sessionStorage.setItem('navigating','true'); location.href = url; }
    const modeBtn = document.getElementById("modeBtn");
    if (localStorage.getItem("mode") === "dark") { document.body.classList.add("dark"); modeBtn.innerText = "☀️"; }
    function toggleMode() {
        document.body.classList.toggle("dark");
        const dark = document.body.classList.contains("dark");
        localStorage.setItem("mode", dark ? "dark" : "light");
        modeBtn.innerText = dark ? "☀️" : "🌙";
    }
    const modal=document.getElementById("modal"),search=document.getElementById("searchInput"),catFilter=document.getElementById("catFilter"),sortFilter=document.getElementById("sortFilter"),filtersBox=document.getElementById("filtersBox"),nameInput=document.getElementById("name"),cat=document.getElementById("cat"),desc=document.getElementById("desc"),type=document.getElementById("type"),otherCategory=document.getElementById("otherCategory");
    let allSkills=[],editingId=null;
    function getToken(){return localStorage.getItem("token");}
    function getCurrentUser(){const u=localStorage.getItem("userId"),n=localStorage.getItem("username");if(!u)return null;return{id:parseInt(u),username:n};}
    function authHeaders(){return{"Content-Type":"application/json","Authorization":`Bearer ${getToken()}`};}
    function escapeHtml(s){if(!s)return'';return s.replace(/[&<>]/g,m=>m==='&'?'&amp;':m==='<'?'&lt;':'&gt;');}
    function handleUnauthorized(res){if(res.status===401||res.status===403){alert("Session expired.");localStorage.clear();location.href="login.html";return true;}return false;}
    window.addEventListener('beforeunload',()=>{const u=localStorage.getItem('userId'),n=sessionStorage.getItem('navigating');if(u&&!n)navigator.sendBeacon(`${API}/presence/offline/${u}`);sessionStorage.removeItem('navigating');});
    async function loadSkills(){try{const res=await fetch(`${API}/api/skills`);if(!res.ok)throw new Error();allSkills=await res.json();updateDisplay();}catch(e){document.getElementById("skillsContainer").innerHTML='<div class="empty-state">⚠️ Could not load skills.</div>';}}
    function updateDisplay(){let f=[...allSkills];const q=search.value.toLowerCase();if(q)f=f.filter(x=>(x.name||'').toLowerCase().includes(q)||(x.skillToTeach||'').toLowerCase().includes(q)||(x.skillToLearn||'').toLowerCase().includes(q)||(x.category||'').toLowerCase().includes(q)||(x.type||'').toLowerCase().includes(q)||(x.description||'').toLowerCase().includes(q)||(x.user?.username||'').toLowerCase().includes(q));if(catFilter.value)f=f.filter(x=>x.category?.toLowerCase()===catFilter.value.toLowerCase());if(sortFilter.value==="az")f.sort((a,b)=>a.name.localeCompare(b.name));if(sortFilter.value==="za")f.sort((a,b)=>b.name.localeCompare(a.name));if(sortFilter.value==="pop")f.sort((a,b)=>(b.popularity||0)-(a.popularity||0));displaySkills(f);}
    function displaySkills(skills){const c=document.getElementById("skillsContainer");if(!skills.length){c.innerHTML='<div class="empty-state">✨ No skills found. Add one!</div>';return;}const cu=getCurrentUser(),uid=localStorage.getItem("userId"),liked=JSON.parse(localStorage.getItem(`likedSkills_${uid}`)||"[]");c.innerHTML=skills.map(s=>{const u=s.user||{},un=u.username||"Unknown",own=cu&&(s.user?.id===cu.id),lk=liked.includes(s.id);return`<div class="skill-card" onclick="navigate('details.html?id=${s.id}')"><div class="skill-name">${escapeHtml(s.name)}</div><div class="skill-category">#${escapeHtml(s.category||"General")}</div>${s.description?`<div class="skill-description">${escapeHtml(s.description)}</div>`:''}${s.skillToTeach?`<div style="font-size:0.75rem;margin:4px 0;color:var(--text-light);">📖 Teaches: <strong style="color:var(--text)">${escapeHtml(s.skillToTeach)}</strong></div>`:''}${s.skillToLearn?`<div style="font-size:0.75rem;margin:4px 0;color:var(--text-light);">📚 Wants to learn: <strong style="color:var(--text)">${escapeHtml(s.skillToLearn)}</strong></div>`:''}<div class="user-row"><div class="user-info"><div class="user-avatar">${(un.charAt(0)||'U').toUpperCase()}</div><div><div class="user-name">${escapeHtml(un)}</div><div><span class="online-dot ${u.online?'online':'offline'}"></span><span style="font-size:0.65rem;">${u.online?'Online':'Offline'}</span></div></div></div><div class="type-badge ${s.type==='teach'?'type-teach':'type-learn'}">${s.type==='teach'?'TEACH':'LEARN'}</div></div><div class="card-footer"><div class="popularity">🔥 ${s.popularity||0}</div><div class="action-group"><button class="action-btn" onclick="event.stopPropagation();increasePopularity(${s.id})" title="${lk?'Already liked':'Like'}" style="${lk?'opacity:0.4;cursor:not-allowed;':''}">${lk?'❤️':'🤍'}</button>${own?`<button class="action-btn" onclick="event.stopPropagation();editSkill(${s.id})">✏️</button><button class="action-btn" onclick="event.stopPropagation();deleteSkill(${s.id})">🗑️</button>`:''}</div></div></div>`;}).join('');}
    async function addSkill(){const cu=getCurrentUser();if(!cu){location.href="login.html";return;}const cv=cat.value==="Other"?otherCategory.value.trim():cat.value;if(!nameInput.value.trim()){alert("Enter skill name");return;}const sk={name:nameInput.value.trim(),category:cv,description:desc.value.trim(),type:type.value,skillToTeach:document.getElementById("skillToTeach").value.trim(),skillToLearn:document.getElementById("skillToLearn").value.trim()};const btn=document.getElementById("addBtn");btn.disabled=true;btn.innerText="Saving...";try{const url=editingId?`${API}/api/skills/${editingId}`:`${API}/api/skills`,method=editingId?"PUT":"POST",res=await fetch(url,{method,headers:authHeaders(),body:JSON.stringify(sk)});if(handleUnauthorized(res))return;if(!res.ok){alert("Could not save skill");return;}resetForm();await loadSkills();}catch(e){alert("Connection error.");}finally{btn.disabled=false;btn.innerText="Save";}}
    async function deleteSkill(id){if(!getCurrentUser()){location.href="login.html";return;}if(!confirm("Delete this skill?"))return;try{const res=await fetch(`${API}/api/skills/${id}`,{method:"DELETE",headers:authHeaders()});if(handleUnauthorized(res))return;if(!res.ok){alert("Could not delete skill");return;}await loadSkills();}catch(e){alert("Connection error.");}}
    function editSkill(id){if(!getCurrentUser()){location.href="login.html";return;}const s=allSkills.find(x=>x.id===parseInt(id));if(!s){alert("Skill not found");return;}nameInput.value=s.name;cat.value=s.category||"";desc.value=s.description||"";type.value=s.type||"teach";document.getElementById("skillToTeach").value=s.skillToTeach||"";document.getElementById("skillToLearn").value=s.skillToLearn||"";if(!["Programming","Design","Business","Language","Fitness",""].includes(s.category)){cat.value="Other";otherCategory.style.display="block";otherCategory.value=s.category||"";}else{otherCategory.style.display="none";}editingId=parseInt(id);modal.style.display="flex";}
    async function increasePopularity(id){if(!getCurrentUser()){alert("Please login to like!");location.href="login.html";return;}const uid=localStorage.getItem("userId"),key=`likedSkills_${uid}`,lk=JSON.parse(localStorage.getItem(key)||"[]");if(lk.includes(id)){alert("You already liked this skill! ❤️");return;}try{const res=await fetch(`${API}/api/skills/${id}/increase`,{method:"PUT",headers:authHeaders()});if(handleUnauthorized(res))return;if(res.ok){lk.push(id);localStorage.setItem(key,JSON.stringify(lk));await loadSkills();}}catch(e){console.error("Like failed",e);}}
    function openModal(){if(!getCurrentUser()){alert("Please login first!");location.href="login.html";return;}resetForm();modal.style.display="flex";}
    function resetForm(){modal.style.display="none";editingId=null;nameInput.value="";cat.value="";desc.value="";type.value="teach";otherCategory.value="";otherCategory.style.display="none";document.getElementById("skillToTeach").value="";document.getElementById("skillToLearn").value="";}
    function toggleFilters(){filtersBox.style.display=filtersBox.style.display==="flex"?"none":"flex";}
    cat.onchange=()=>{otherCategory.style.display=cat.value==="Other"?"block":"none";};
    function loadUser(){
        const un=localStorage.getItem("username");
        if(!un){
            document.getElementById("navUser").innerHTML=`<button class="btn" style="padding:6px 14px;font-size:0.8rem;border-radius:20px;" onclick="navigate('login.html')">Login</button>`;
        } else {
            document.getElementById("navUser").innerHTML=`
                <div class="nav-user-pill" onclick="toggleUserDropdown(event)" title="Account">
                    <div class="nav-user-avatar">${un.charAt(0).toUpperCase()}</div>
                    ${escapeHtml(un)}
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:0.5;margin-left:2px"><polyline points="6 9 12 15 18 9"/></svg>
                    <div class="user-dropdown" id="userDropdown">
                        <button class="dropdown-item" onclick="navigate('profile.html')">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            View Profile
                        </button>
                        <button class="dropdown-item" onclick="navigate('sessions.html')">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                            My Sessions
                        </button>
                        <button class="dropdown-item" onclick="navigate('swaps.html')">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                            My Swaps
                        </button>
                        <div class="dropdown-divider"></div>
                        <button class="dropdown-item danger" onclick="logout()">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                            Logout
                        </button>
                    </div>
                </div>`;
        }
    }

    function toggleUserDropdown(e) {
        e.stopPropagation();
        document.getElementById("userDropdown").classList.toggle("open");
    }

    // Close dropdown when clicking outside
    document.addEventListener('click', function() {
        const dd = document.getElementById("userDropdown");
        if (dd) dd.classList.remove("open");
    });
    async function logout(){const uid=localStorage.getItem('userId');if(uid)navigator.sendBeacon(`${API}/presence/offline/${uid}`);try{await fetch(`${API}/api/users/logout`,{method:"POST",headers:authHeaders()});}catch(_){}localStorage.removeItem("token");localStorage.removeItem("userId");localStorage.removeItem("username");localStorage.removeItem("email");location.href="login.html";}
    function toggleMobileNav(){document.getElementById("mobileNav").classList.toggle("open");}
    function closeMobileNav(){document.getElementById("mobileNav").classList.remove("open");}
    document.addEventListener('click',function(e){const nav=document.getElementById("mobileNav"),ham=document.querySelector(".hamburger");if(nav.classList.contains("open")&&!nav.contains(e.target)&&!ham.contains(e.target))closeMobileNav();});
    async function loadCoinBalance(){if(!getToken())return;try{const res=await fetch(`${API}/api/coins/balance`,{headers:authHeaders()});if(res.ok){const d=await res.json(),b=d.balance??0;document.getElementById("navCoinCount").textContent=b;const mc=document.getElementById("mobileCoins");if(mc)mc.textContent="🪙 "+b;}}catch(e){document.getElementById("navCoinCount").textContent="0";}}
    async function loadUnreadCount(){if(!getToken())return;try{const res=await fetch(`${API}/api/messages/unread/count`,{headers:authHeaders()});if(res.ok){const d=await res.json(),cnt=d.count??0,badge=document.getElementById("chatBadge"),bb=document.getElementById("bottomChatBadge");if(cnt>0){const lbl=cnt>99?"99+":cnt;if(badge){badge.textContent=lbl;badge.style.display="flex";}if(bb){bb.textContent=lbl;bb.style.display="flex";}}else{if(badge)badge.style.display="none";if(bb)bb.style.display="none";}}}catch(e){}}
    search.oninput=updateDisplay;catFilter.onchange=updateDisplay;sortFilter.onchange=updateDisplay;
    loadSkills();loadUser();loadCoinBalance();loadUnreadCount();setInterval(loadUnreadCount,15000);
    const viewBtn=document.getElementById("viewToggleBtn");
    function applyViewMode(){const m=localStorage.getItem("viewMode")==="mobile";document.body.classList.toggle("mobile-view",m);viewBtn.textContent=m?"🖥️":"📱";viewBtn.setAttribute("data-tip",m?"Desktop view":"Mobile view");}
    function toggleView(){localStorage.setItem("viewMode",localStorage.getItem("viewMode")==="mobile"?"desktop":"mobile");applyViewMode();}
    applyViewMode();
</script>
</body>
</html>
