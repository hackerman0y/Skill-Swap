<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profile</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ── Badge chip ──────────────────────────────────────────────── */
        .equipped-badge {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: 0.72rem; font-weight: 600;
            padding: 3px 10px; border-radius: 20px;
            background: rgba(108,99,255,0.13);
            border: 1px solid rgba(108,99,255,0.3);
            color: #a89fff; vertical-align: middle;
            margin-left: 6px; white-space: nowrap;
        }

        /* ── Inventory ───────────────────────────────────────────────── */
        .inventory-section { margin-top: 2rem; text-align: center; }
        .inventory-section h3 { margin-bottom: 1rem; }
        .inventory-grid {
            display: flex; flex-wrap: wrap;
            gap: 0.75rem; justify-content: center;
        }
        .inventory-item {
            background: rgba(108,99,255,0.08);
            border: 1.5px solid rgba(108,99,255,0.18);
            border-radius: 14px; padding: 0.85rem 1rem;
            text-align: center; min-width: 100px;
            transition: border-color 0.18s, transform 0.18s;
        }
        .inventory-item:hover { border-color: rgba(108,99,255,0.45); transform: translateY(-2px); }
        .inventory-item.is-equipped {
            border-color: #10b981;
            background: rgba(16,185,129,0.08);
        }
        .item-icon { font-size: 1.8rem; }
        .item-name { font-size: 0.8rem; font-weight: 600; margin-top: 4px; color: var(--text); }
        .item-type {
            font-size: 0.68rem; color: #94a3b8;
            text-transform: uppercase; margin-top: 2px; letter-spacing: 0.4px;
        }

        /* ── Toast ───────────────────────────────────────────────────── */
        .toast {
            position: fixed; bottom: 28px; left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #10b981; color: white; padding: 12px 24px; border-radius: 20px;
            font-size: 0.88rem; font-weight: 600;
            box-shadow: 0 8px 24px rgba(16,185,129,0.35);
            z-index: 2000; transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
            white-space: nowrap; pointer-events: none;
        }
        .toast.show  { transform: translateX(-50%) translateY(0); }
        .toast.error { background: #ef4444; box-shadow: 0 8px 24px rgba(239,68,68,0.35); }

        .btn-back {
            padding: 8px 16px; border-radius: 20px; border: none;
            cursor: pointer; font-weight: 600; color: white;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            transition: 0.2s; font-size: 0.9rem; margin-bottom: 20px;
        }
        .btn-back:hover { opacity: 0.9; transform: translateX(-2px); }
    </style>
</head>
<body>

<div class="navbar">
    <h2 id="pageTitle">User Profile</h2>
    <div class="nav-right">
        <button class="mode-btn" id="modeBtn" onclick="toggleMode()">🌙</button>
        <button class="btn-back" onclick="goBack()">← Back</button>
    </div>
</div>

<div class="profile-container">
    <button class="btn-back" onclick="goBack()">← Back to Details</button>

    <div class="avatar">👤</div>
    <!-- username + equipped badge rendered here -->
    <h2 id="username">Loading...</h2>
    <p id="email" class="email-text"></p>
    <p id="status" class="status-text"></p>
    <div id="skillsList" class="skills-list"></div>
</div>

<div class="toast" id="toast"></div>

<script>
    const API    = "http://localhost:8080";
    const token  = localStorage.getItem("token");
    const currentUserId = localStorage.getItem("userId");

    // Get userId from URL query param
    const params = new URLSearchParams(window.location.search);
    const userId = params.get("userId");

    if (!userId) {
        document.querySelector('.profile-container').innerHTML = "<h3>Invalid user ID</h3>";
    }

    // Active badge state for this user
    let userBadgeId   = null;
    let userBadgeName = '';

    // Badge emoji lookup
    const BADGE_EMOJI = {
        'Top Teacher':       '👑',
        'Expert Badge':      '⭐',
        'Early Adopter':     '🚀',
        'Gold Frame':        '🟨',
        'Diamond Frame':     '💎',
        'Fire Frame':        '🔥',
        'Galaxy Frame':      '🌌',
        '10% Discount':      '🎫',
        'Free Pass':         '🎁',
        'Profile Boost 24h': '✨',
        'Skill Spotlight':   '💫',
        'Double XP Weekend': '⚡',
    };

    function goBack() { window.history.back(); }
    function authHeaders() { return { "Content-Type": "application/json", "Authorization": `Bearer ${token}` }; }

    const modeBtn = document.getElementById("modeBtn");
    if (localStorage.getItem("mode") === "dark") { document.body.classList.add("dark"); modeBtn.innerText = "☀️"; }
    function toggleMode() {
        document.body.classList.toggle("dark");
        const dark = document.body.classList.contains("dark");
        localStorage.setItem("mode", dark ? "dark" : "light");
        modeBtn.innerText = dark ? "☀️" : "🌙";
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;');
    }

    // ── Render the badge chip next to the username ────────────────────────────
    function renderUsernameBadge() {
        const nameEl = document.getElementById('username');
        const badgeHTML = userBadgeName
            ? ` <span class="equipped-badge">${BADGE_EMOJI[userBadgeName] || '🏷️'} ${escapeHtml(userBadgeName)}</span>`
            : '';
        const name = nameEl.dataset.name || nameEl.textContent.split('<')[0].trim();
        nameEl.dataset.name = name;
        nameEl.innerHTML = escapeHtml(name) + badgeHTML;
    }

    function showToast(msg, isError = false) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.className   = `toast${isError ? ' error' : ''}`;
        setTimeout(() => t.classList.add("show"), 10);
        setTimeout(() => t.classList.remove("show"), 3200);
    }

    function getItemIcon(type) {
        return { frame:'🖼️', badge:'🏅', coupon:'🎟️', boost:'⚡' }[type] || '🎁';
    }

    window.addEventListener('beforeunload', () => {
        const navigating = sessionStorage.getItem('navigating');
        if (currentUserId && !navigating) navigator.sendBeacon(`${API}/presence/offline/${currentUserId}`);
        sessionStorage.removeItem('navigating');
    });

    // ── Load user profile ──────────────────────────────────────────────────────
    async function loadProfile() {
        try {
            const userRes = await fetch(`${API}/api/users/${userId}`, {
                headers: authHeaders()
            });

            if (!userRes.ok) {
                document.querySelector('.profile-container').innerHTML = "<h3>❌ User not found</h3>";
                return;
            }

            const user = await userRes.json();

            // Sync equipped badge from server
            if (user.activeBadgeId) {
                userBadgeId   = user.activeBadgeId;
                userBadgeName = user.activeBadgeName ?? '';
            }

            // Update page title
            document.getElementById("pageTitle").textContent = user.username ? `${user.username}'s Profile` : "User Profile";

            // Render username + badge
            const nameEl = document.getElementById('username');
            nameEl.dataset.name = user.username || 'Unknown User';
            renderUsernameBadge();

            document.getElementById("email").innerText  = user.email || '';
            document.getElementById("status").innerHTML = user.online ? "🟢 Online" : "⚫ Offline";

            // Load skills
            const skillsRes = await fetch(`${API}/api/skills/user/${user.id}`, {
                headers: authHeaders()
            });

            if (!skillsRes.ok) throw new Error();

            const skills = await skillsRes.json();
            const list   = document.getElementById("skillsList");

            list.innerHTML = skills.length
                ? "<h3>Skills</h3>" + skills.map(s => `
                    <div class="skill-item">
                        <b>${escapeHtml(s.name)}</b> — ${escapeHtml(s.category || "")}
                        <span class="skill-type-badge ${s.type === 'teach' ? 'badge-teach' : 'badge-learn'}">${s.type}</span>
                        <p>${escapeHtml(s.description || "")}</p>
                        <small>🔥 ${s.popularity || 0}</small>
                    </div>`).join('')
                : "<p class='no-skills'>No skills yet</p>";

            // Load inventory
            loadInventory(user.id);

        } catch(e) {
            console.error('Error loading profile:', e);
            document.querySelector('.profile-container').innerHTML = "<p>Could not load profile</p>";
        }
    }

    // ── Load inventory ────────────────────────────────────────────────────────
    async function loadInventory(userId) {
        try {
            const res = await fetch(`${API}/api/store/inventory?userId=${userId}`, {
                headers: authHeaders()
            });
            if (!res.ok) return;
            const items = await res.json();
            if (!items.length) return;

            const section = document.createElement('div');
            section.className = 'inventory-section';
            section.innerHTML = `
                <h3>🎒 Items</h3>
                <div class="inventory-grid">
                    ${items.map(i => {
                const item       = i.item ?? i;
                const itemId     = item.id;
                const isEquipped = itemId === userBadgeId;
                const emoji      = BADGE_EMOJI[item.name] || getItemIcon(item.category ?? item.type);
                return `
                        <div class="inventory-item ${isEquipped ? 'is-equipped' : ''}" data-item-id="${itemId}">
                            <div class="item-icon">${emoji}</div>
                            <div class="item-name">${escapeHtml(item.name)}</div>
                            <div class="item-type">${escapeHtml(item.category ?? item.type ?? '')}</div>
                        </div>`;
            }).join('')}
                </div>`;
            document.querySelector('.profile-container').appendChild(section);
        } catch(e) { console.error('Inventory load failed', e); }
    }

    loadProfile();
</script>
</body>
</html>
